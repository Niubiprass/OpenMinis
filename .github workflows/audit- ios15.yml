# OpenMinis · iOS 15 兼容性体检（不编译，1~2 分钟出报告）
#
# 作用：检出源码后，扫描所有 Swift 文件里用到的 iOS 16/17/18/26 专属 API，
#       生成一份“必须降级”的清单（文件:行号），供人工/AI 精准修补。
#       注意：守卫在 #available(iOS 16, *) 里的用法也会列出，需自行判断是否真有问题。
#
# 用法：放进仓库 .github/workflows/ → Actions → 手动 Run workflow。
#       产物 artifact：ios15-audit-report.txt

name: Audit OpenMinis for iOS 15

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 扫描 iOS 16+ 专属 API 用法
        run: |
          set -e
          OUT=ios15-audit-report.txt
          echo "OpenMinis → iOS 15.5 兼容性体检报告" > "$OUT"
          echo "生成时间: $(date -u)" >> "$OUT"
          echo "扫描目录: src/ios (含子模块外的主工程)" >> "$OUT"
          echo "=========================================" >> "$OUT"

          # 需要降级的 iOS 16/17/18/26 专属符号（按出现频率挑选）
          PATTERNS=(
            'presentationDetents'
            'presentationDragIndicator'
            'presentationBackground'
            'presentationCornerRadius'
            'presentationContentInteraction'
            'NavigationStack'
            'NavigationSplitView'
            'navigationDestination'
            'NavigationLink\(value:'
            'GridRow'
            'AnyLayout'
            'ViewThatFits'
            'ShareLink'
            'UIHostingConfiguration'
            'symbolEffect'
            'containerBackground'
            'scrollTargetBehavior'
            'scrollPosition'
            'listSectionSpacing'
            'contentMargins'
            'scrollClipDisabled'
            'sensoryFeedback'
            '@Observable'
            'AppIntent'
            'ControlWidget'
            'Chart('
            'onChange(of:'
            'presentationSizing'
            'lookupAll'
            'UIPageControl'
          )

          total=0
          for p in "${PATTERNS[@]}"; do
            hits=$(grep -rn --include='*.swift' "$p" src/ios 2>/dev/null || true)
            if [ -n "$hits" ]; then
              echo "" >> "$OUT"
              echo ">>> 疑似 iOS 16+ 符号: $p" >> "$OUT"
              echo "$hits" | sed 's/^/    /' >> "$OUT"
              n=$(echo "$hits" | wc -l)
              total=$((total+n))
            fi
          done

          echo "" >> "$OUT"
          echo "=========================================" >> "$OUT"
          echo "合计疑似命中: $total 处（含已守卫用法，需人工甄别）" >> "$OUT"
          cat "$OUT"

      - name: 上传体检报告
        uses: actions/upload-artifact@v4
        with:
          name: ios15-audit-report
          path: ios15-audit-report.txt
          if-no-files-found: warn
