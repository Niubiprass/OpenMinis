name: OpenMinis IPA

on:
  workflow_dispatch:
    inputs:
      build_ipa:
        description: '真正编译IPA（勾选会消耗macOS时长，约30-60分钟）'
        type: boolean
        default: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: 扫描iOS16+ API
        run: |
          OUT=ios15-audit-report.txt
          : > "$OUT"
          for p in presentationDetents NavigationStack navigationDestination NavigationSplitView GridRow AnyLayout ViewThatFits ShareLink UIHostingConfiguration symbolEffect containerBackground scrollTargetBehavior scrollPosition listSectionSpacing contentMargins sensoryFeedback '@Observable' AppIntent ControlWidget 'Chart(' 'NavigationLink(value:' presentationDragIndicator presentationBackground presentationCornerRadius; do
            grep -rn --include='*.swift' "$p" src/ios >> "$OUT" || true
          done
          cat "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ios15-audit-report
          path: ios15-audit-report.txt

  build:
    if: ${{ inputs.build_ipa }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: 安装工具
        run: |
          brew install ninja llvm libarchive pkg-config
          pip3 install meson
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: 选Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
      - name: 配置模板
        run: cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig
      - name: 部署目标改15.5
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g' src/ios/Minis.xcodeproj/project.pbxproj
          grep -n "IPHONEOS_DEPLOYMENT_TARGET" src/ios/Minis.xcodeproj/project.pbxproj | head
      - name: 原生依赖(LAME→FFmpeg→iSH→Alpine)
        run: |
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
      - name: 编译App(不签名)
        run: |
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -derivedDataPath DerivedData build 2>&1 | tee build.log
      - name: 打包IPA
        run: |
          APP=$(find DerivedData -name "Minis.app" -type d | head -1)
          [ -z "$APP" ] && { echo "未找到Minis.app"; exit 1; }
          mkdir Payload && cp -r "$APP" Payload/ && zip -r Minis.ipa Payload && ls -lh Minis.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Minis-iOS15.5-ipa
          path: Minis.ipa
      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build.log
          if-no-files-found: ignore
