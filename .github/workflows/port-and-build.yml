            _v42_thruse=$(python3 -c "t=open('src/ios/Views/Chat/SelectableMarkdownView.swift',encoding='utf-8').read(); s=t.index('// [V42-FALLBACK] 闩锁(带键缓存) + 兜底自测'); g=t[s:s+4000]; print('OK' if g.count('_v42Need = self.ios15LatchedNeedH')==2 else 'BAD')")
