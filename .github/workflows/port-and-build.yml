name: iOS15 移植并打包 IPA

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "最低系统版本 (iOS 15 用 15.5)"
        required: true
        default: "15.5"
      skip_port:
        description: "跳过源码移植 (已移植过、只想重新打包时用)"
        type: boolean
        default: false

# 需要写权限，才能把移植后的代码提交回你的 fork
permissions:
  contents: write

jobs:
  port-and-build:
    runs-on: macos-latest
    steps:
      - name: 检出仓库 (含子模块)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装依赖工具
        run: |
          brew install ninja llvm lld libarchive pkg-config meson go || true
          python3 -m pip install --break-system-packages meson || python3 -m pip install --user meson || true
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/meson/bin" >> "$GITHUB_PATH"

      - name: 验证工具链
        run: |
          meson --version
          ninja --version
          go version
          clang --version | head -1

      - name: 修复 lld 链接器可见性 (iSH 需要)
        run: |
          sudo mkdir -p /usr/local/bin
          for base in "$(brew --prefix lld)/bin" "$(brew --prefix llvm)/bin"; do
            for t in ld.lld ld64.lld wasm-ld; do
              if [ -x "$base/$t" ]; then sudo ln -sf "$base/$t" "/usr/local/bin/$t"; fi
            done
          done
          which ld.lld
          ld.lld --version

      - name: 选 Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: 源码移植到 iOS 15
        if: ${{ !inputs.skip_port }}
        run: python3 scripts/ios15_port.py src/ios

      - name: 提交移植结果 (幂等)
        if: ${{ !inputs.skip_port }}
        run: |
          git config user.email "ios15-port@codebuddy.local"
          git config user.name "iOS15 Port Bot"
          git add -A
          if git diff --cached --quiet; then
            echo "无改动，跳过提交"
          else
            git commit -m "Auto-port OpenMinis to iOS 15 (NavigationView + 去掉 presentationDetents)"
            git push
          fi

      - name: 设置部署目标 (主 App=${{ inputs.deploy_target }}, FileProvider 扩展=16.0)
        run: |
          # 先把所有目标（含工程级）设为 15.5
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = ${{ inputs.deploy_target }};/g' src/ios/Minis.xcodeproj/project.pbxproj
          # MinisFileProvider 扩展用了 iOS16 专属 API，单独抬到 16.0（15.5 上不被系统加载，不影响主程序）
          python3 scripts/fix_fileprovider_deployment.py
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig 2>/dev/null || true
          echo "=== 部署目标分布 ==="
          grep -n "IPHONEOS_DEPLOYMENT_TARGET" src/ios/Minis.xcodeproj/project.pbxproj | head

      - name: 编译原生依赖 (LAME→FFmpeg→iSH→Alpine→RClone)
        run: |
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          sed -i '' 's/-miphoneos-version-min=[0-9.]*/-miphoneos-version-min=${{ inputs.deploy_target }}/; s/-mios-simulator-version-min=[0-9.]*/-mios-simulator-version-min=${{ inputs.deploy_target }}/' deps/build_rclone_ios.sh
          ./deps/build_rclone_ios.sh

      - name: 编译 App (不签名)
        run: |
          set +e
          xcodebuild -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath DerivedData build > build.log 2>&1
          RC=$?
          set -e
          echo "=== 编译日志尾部 ==="
          tail -n 50 build.log
          if [ "$RC" -ne 0 ]; then
            echo "❌ 编译失败 (xcodebuild 退出码 $RC)，请在产物 build-logs 中搜索 'error:'"
            exit "$RC"
          fi
          echo "✅ 编译成功"

      - name: 打包 IPA (供 TrollStore 安装)
        if: success()
        run: |
          echo "=== 所有 Minis.app 候选及大小 ==="
          find DerivedData -name "Minis.app" -type d -exec du -sh {} + || true
          APP="DerivedData/Build/Products/Release-iphoneos/Minis.app"
          if [ ! -d "$APP" ]; then
            APP=$(find DerivedData -name "Minis.app" -type d -exec du -sk {} + | sort -rn | head -1 | cut -f2)
          fi
          echo "=== 选用: $APP ==="
          du -sh "$APP"
          if [ ! -f "$APP/Info.plist" ]; then echo "❌ Info.plist 不存在，打包中止"; exit 1; fi
          rm -rf Payload "Minis-iOS${{ inputs.deploy_target }}.ipa"
          mkdir -p Payload
          ditto "$APP" "Payload/Minis.app"
          zip -qry "Minis-iOS${{ inputs.deploy_target }}.ipa" Payload
          if ! unzip -l "Minis-iOS${{ inputs.deploy_target }}.ipa" | grep -q "Payload/Minis.app/Info.plist"; then
            echo "❌ IPA 结构错误（缺少 Payload/Minis.app/Info.plist）"; exit 1
          fi
          SIZE=$(stat -f%z "Minis-iOS${{ inputs.deploy_target }}.ipa")
          echo "IPA 大小: $SIZE 字节"
          if [ "$SIZE" -lt 10000000 ]; then echo "❌ IPA 小于 10MB，疑似空包，中止上传"; exit 1; fi
          ls -lh "Minis-iOS${{ inputs.deploy_target }}.ipa"

      - name: 上传 IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Minis-iOS${{ inputs.deploy_target }}-ipa
          path: Minis-iOS${{ inputs.deploy_target }}.ipa

      - name: 上传编译日志 (失败时排错用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          if-no-files-found: ignore
