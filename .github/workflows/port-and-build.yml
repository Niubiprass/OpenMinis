            echo "✅ 帧同步修正已注入 (渲染前拉回, 污染帧不会出现在屏幕上)"
          else
            echo "❌ v23 帧同步修正缺失 —— 污染帧仍会被渲染出去一帧, 闪字复发!"; exit 1
          fi
          echo "::group::断言17: v24 hosting 视图硬钉宽度必须就位 (根除 730/100000 超宽气泡 → 字不显示/空白/闪字)"
          if grep -q "ios15AvailW" src/ios/iOS15Compat.swift ; then
            echo "✅ hosting 视图宽度已硬钉 (=可用宽+裁切溢出), 表格/代码块节点不再撑爆气泡, 字不显示/空白/闪字根除"
          else
            echo "❌ v24 硬钉宽度缺失 —— 气泡仍会被表格/代码块撑到 730/100000, 字不显示/空白/闪字复发!"; exit 1
          fi
          echo "::group::断言25: v35 hosting 视图/内容必须全屏宽(不再 -32) (log10-03 实证: v22/v24 把整个 cell 硬钉 358 → 用户气泡右空 48pt 不贴边 / 助手文字压到 326 整体缩小 / 终端框折叠)"
          if grep -q "V35-FULLWIDTH" src/ios/iOS15Compat.swift && ! grep -q "bounds.width - 32" src/ios/iOS15Compat.swift ; then
            echo "✅ hosting 视图/内容已改回全屏宽(bounds.width, 不再 -32), cell 不再被压窄 32pt"
          else
            echo "❌ v35 全屏宽修复缺失 —— hosting 视图仍被硬钉 358, 气泡不贴边/整体缩小/终端框折叠复发!"; exit 1
          fi
          echo "::group::断言18: v25 高度死锁修复必须就位 (textContainer 高放开重算 usedRect → 根除末行半截字/整条不显示)"
          # v34 起 _realW2 不再独立计算, 直接 `let _realW2 = _realW` 复用渲染宽
          # (v28 独立算 cvW-32 撑爆气泡 / v33 独立算 contentW 过渡态分歧, 都已废弃)。
          if grep -q "ios15LastGoodFitH" src/ios/iOS15Compat.swift && grep -qE "let _realW2 = " src/ios/Views/Chat/SelectableMarkdownView.swift ; then
            echo "✅ v25 已注入: 测量 0 高度回退 + 渲染端放开容器高重算 usedRect, 半截字/不显示根除"
          else
            echo "❌ v25 高度修复缺失 —— usedRect 仍被 textContainer 高度死锁, 末行半截字/整条不显示复发!"; exit 1
          fi
          echo "::group::断言19: v26 必须就位 (A=sizeThatFits 测高不再炸容器高 100000; B=守卫熔断收窄为同尺寸才丢, 正确宽度修正不被连坐)"
          if grep -q "sizeThatFits(CGSize(width: _realW2, height: .greatestFiniteMagnitude))" src/ios/Views/Chat/SelectableMarkdownView.swift && ! grep -q "textContainer.size.height = 100000" src/ios/Views/Chat/SelectableMarkdownView.swift && grep -q "kStormForwardLimit \* 4" src/ios/Shared/NSTextContainerSetSizeGuard.m && grep -q "_newTick" src/ios/Shared/NSTextContainerSetSizeGuard.m ; then
            echo "✅ v26 已注入: 风暴源头消除 + 熔断不再连坐正确修正, 不换行/横向裁切根除"
          else
            echo "❌ v26 缺失 —— 容器高 100000 风暴仍会耗光守卫预算, 宽度修正被连坐丢弃, 横向裁切复发!"; exit 1
          fi
          echo "::group::断言20: v27 iOS15 cmark-gfm table 扩展必须启用 (否则表格整段降级为巨型单行纯文本 → 撑爆测量宽 → 高度振荡跳字/半截字/表格乱码)"
          # iOS16/15 两个分支的 extensionNames 名单都必须含 "table" (共 2 处)。
          TL=$(grep 'extensionNames = \[' src/ios/Agent/Markdown/MinisMarkdownParser.swift | grep -c '"table"' | tr -d ' ')
          TN=$(grep -c 'extensionNames = \[' src/ios/Agent/Markdown/MinisMarkdownParser.swift | tr -d ' ')
          if grep -q "IOS15-FIX-TABLE" src/ios/Agent/Markdown/MinisMarkdownParser.swift && [ "$TN" = "2" ] && [ "$TL" = "2" ]; then
            echo "✅ v27 已注入: iOS15/16 两分支都启用 table 扩展, 表格走 UIKit TableAttachment 渲染"
          else
            echo "❌ v27 缺失 (标记=$(grep -c 'IOS15-FIX-TABLE' src/ios/Agent/Markdown/MinisMarkdownParser.swift) 名单处数=$TN 含table=$TL) —— iOS15 表格仍会降级为无换行巨型单行!"; exit 1
          fi
          echo "::group::断言21: v28 表格 probe 宽度钳制 + 抢宽强制重排 (32768 污染 sv → 白色巨块; 抢回 358 不重排 → 行尾裁字)"
          # 【v38 修正】原判据 grep "min(clampedWidth, (containerRealWidth" 只存在于 v28 注入的旧代码,
          # 而 v38-B 把整个 returnWidth 出口重写为 min(usableWidth, max(1, _v38Cap)) —— v28 那行随之消失,
          # 于是断言 21 在 run#98 误报失败(v28 逻辑其实仍在, 只是形态变了)。
          # 教训: 断言不能锚定"某个补丁的旧实现形态", 要锚定**该补丁要达成的效果**。
          # 这里改为验效果: 表格返回宽必须存在一个钳位出口, 且上限取自真实容器宽
          # (containerRealWidth / lastRealWidth / narrowestRealWidth 三者之一)。
          if grep -q "IOS15-FIX-TABLE-PROBE v28" src/ios/Views/Chat/SelectableMarkdownView.swift \
             && grep -q "let returnWidth = min(usableWidth, max(1, _v38Cap))" src/ios/Views/Chat/SelectableMarkdownView.swift \
             && grep -q "let _v38Cap: CGFloat = containerRealWidth ?? lastRealWidth ?? Self.narrowestRealWidth" src/ios/Views/Chat/SelectableMarkdownView.swift ; then
            echo "✅ v28 probe 钳制已注入 (v38 已把出口收敛为单一真实容器宽钳位, 效果等价且更严)"
          else
            echo "❌ v28 probe 钳制缺失 —— 表格消息 superview 仍会被 32768 撑爆, 白色巨块复发!"; exit 1
          fi
          if grep -q "IOS15-FIX-RELC v28" src/ios/Views/Chat/SelectableMarkdownView.swift && grep -q "_ios15WRegrabbed" src/ios/Views/Chat/SelectableMarkdownView.swift ; then
            echo "✅ v28 抢宽强制重排已注入"
          else
            echo "❌ v28 强制重排缺失 —— poll 打回 390 后旧行碎片仍按 390 排版, 行尾裁字复发!"; exit 1
          fi
          echo "::endgroup::"
          echo "::group::断言22: v29 CADisplayLink 停机 bug 修复 + findCollectionView 死角兜底 (log12 实证: superview 宽 100000 每帧污染 16 次, 旧逻辑一帧无污染即停机清表 → 污染帧无人拦截, 白块/裁字上屏)"
          if grep -q "IOS15-FIX-DISPLAYLINK v29" src/ios/Views/Chat/SelectableMarkdownView.swift && grep -q "if !alive {" src/ios/Views/Chat/SelectableMarkdownView.swift && ! grep -q "if !need {" src/ios/Views/Chat/SelectableMarkdownView.swift ; then
            echo "✅ v29 停机修复已注入 (仅全视图离窗才停机, 活视图常驻抢帧)"
          else
            echo "❌ v29 停机修复缺失 —— CADisplayLink 仍会一帧无污染即永久停机, 白块/裁字复发!"; exit 1
          fi
          if [ "$(grep -c 'UIScreen.main.bounds.width' src/ios/Views/Chat/SelectableMarkdownView.swift)" -ge 2 ]; then
            echo "✅ v29 findCollectionView 死角屏宽兜底已注入 (ApplyFrameFix + KVO 两处)"
          else
            echo "❌ v29 屏宽兜底缺失 —— hosting 层级遍历失败时抢帧被放弃, 白块死角仍在!"; exit 1
          fi
          echo "::endgroup::"
          echo "::group::断言23: v31 双引擎测高反振荡(静止态反向锁) + 流式测高节流 + 输入栏假死自愈 (log14 实证: 1201↔945 ~10s 翻转仍跳动, v30-A 2s窗口过期放行)"
          if grep -q "V31-FLIPLOCK" src/ios/Agent/MessageList/MessageListLayout.swift && grep -q "v31MaxH" src/ios/Agent/MessageList/MessageListLayout.swift ; then
            echo "✅ v31-A 双引擎测高反振荡(静止态反向锁)已注入"
          else
            echo "❌ v31-A 反振荡缺失 —— 1201↔945 ping-pong 复发, 列表高度瞬间跳动!"; exit 1
          fi
          if grep -q "V30-THROTTLE" src/ios/Views/Chat/SelectableMarkdownView.swift && grep -q "ios15LastFullMeasureAt" src/ios/Views/Chat/SelectableMarkdownView.swift ; then
            echo "✅ v30-B 流式测高节流已注入 (~8次/秒)"
          else
            echo "❌ v30-B 测高节流缺失 —— 主线程仍被每 token 全量 TextKit 排版占满!"; exit 1
          fi
          if grep -q "composerRebuildTick" src/ios/Views/Chat/AIChatView.swift && grep -q "V30-KICK" src/ios/Views/Chat/AIChatView.swift ; then
            echo "✅ v30-C 输入栏假死自愈已注入 (STALLED 就地重建 composer)"
          else
            echo "❌ v30-C 输入栏自愈缺失 —— STALLED 只能退出重进会话!"; exit 1
          fi
          echo "::endgroup::"
          echo "::group::断言24: v34 宽度单一写入点 + 渲染/测高共享 contentW (log10-03 实证: v33 的 contentW 式在过渡态双重扣减, tcW 390×27/326×25 交替 → 整体缩小/不贴边/闪屏; superview 基准对此免疫)"
          # 注意: 只 grep 注释标记会被"补丁写了注释但赋值没换"骗过 (v32 就这样蒙混
          # 过了 —— 锚点与真实源码不符, 替换全部 no-op, 但 V32-WIDTH 注释确实存在)。
          # 故此处校验 v34 的**真实行为链**: 共享属性声明 + 渲染端写入 + _realW2 复用
          # + 测高端读取, 并断言 v32/v33 的独立 contentW 式与 v28 的 cvW-32 均无残留。
          if [ "$(grep -c 'var ios15LastRenderContentW: CGFloat?' src/ios/Views/Chat/SelectableMarkdownView.swift)" -eq 1 ] \
             && [ "$(grep -c 'ios15LastRenderContentW = _realW' src/ios/Views/Chat/SelectableMarkdownView.swift)" -eq 1 ] \
             && [ "$(grep -cE 'let _realW2 = _realW$' src/ios/Views/Chat/SelectableMarkdownView.swift)" -eq 1 ] \
             && [ "$(grep -c 'if let _lastW = ios15LastRenderContentW, _lastW > 200 { return _lastW }' src/ios/Views/Chat/SelectableMarkdownView.swift)" -eq 1 ] \
             && ! grep -qE 'let _realW2 = max\(200\.0, _cvW - 32\)' src/ios/Views/Chat/SelectableMarkdownView.swift \
             && ! grep -qE 'let _realW2 = max\(200\.0, min\(bounds\.width, _cvW\)' src/ios/Views/Chat/SelectableMarkdownView.swift \
             && ! grep -qE 'let _realW = max\(200\.0, min\(bounds\.width, _cvW\)' src/ios/Views/Chat/SelectableMarkdownView.swift ; then
            echo "✅ v34 宽度单一写入点(_realW) + 渲染/测高共享 contentW 已落地, 旧独立式零残留"
          else
            echo "❌ v34 宽度同步缺失或残留旧式 —— 渲染/测高宽分歧 → 整体缩小/不贴边/闪屏复发!"; exit 1
          fi
          echo "::endgroup::"
          echo "::group::断言13: v18 KVO 抢帧必须就位 (污染帧在渲染前被改回, 消抢帧拉锯闪烁)"
          if grep -q "ios15InstallKVO" src/ios/Views/Chat/SelectableMarkdownView.swift && grep -q "NSKeyValueObservation" src/ios/Views/Chat/SelectableMarkdownView.swift ; then
            echo "✅ KVO 抢帧已注入"
          else
            echo "❌ KVO 抢帧缺失 —— 污染帧仍会渲染出去一帧, 闪字复发!"; exit 1
          fi
          echo "::endgroup::"

      - name: "设置部署目标 (主 App=${{ env.DEPLOY_TARGET }}, 扩展单独抬高)"
        run: |
          set -e
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = ${{ env.DEPLOY_TARGET }};/g' src/ios/Minis.xcodeproj/project.pbxproj
          python3 "$SCRIPT_DIR/fix_fileprovider_deployment.py"
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig 2>/dev/null || true
          echo "=== 部署目标分布 ==="
          grep -n "IPHONEOS_DEPLOYMENT_TARGET" src/ios/Minis.xcodeproj/project.pbxproj | head

      - name: "编译原生依赖 (LAME/FFmpeg/iSH/Alpine/RClone)"
        run: |
          set -e
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          sed -i '' 's/-miphoneos-version-min=[0-9.]*/-miphoneos-version-min=${{ env.DEPLOY_TARGET }}/; s/-mios-simulator-version-min=[0-9.]*/-mios-simulator-version-min=${{ env.DEPLOY_TARGET }}/' deps/build_rclone_ios.sh
          ./deps/build_rclone_ios.sh

      - name: "编译 App (不签名)"
        run: |
          set -e
          echo "============ 编译 (Release / iOS) ============"
          xcodebuild -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath DerivedData build > build.log 2>&1
          echo "=== 编译错误行 (error:, 最多 80 条) ==="
          grep -n "error:" build.log | grep -v "0 errors" | head -80 || true
          echo "编译成功"

      - name: "剥离 iOS 15 不可启动的扩展 (dyld 体检: 缺框架 or 部署目标过高)"
        if: success()
        run: |
          set -e
          # 判据与实现见 scripts/strip_ios15_incompatible_extensions.py 的文档串:
          #   (a) 链接 iOS 15.5 不存在的框架 (AgentWidgetExtension → _AppIntents_SwiftUI)
          #   (b) LC_BUILD_VERSION.minos > 15.5 (MinisFileProvider 被抬到 16.0, 含
          #       iOS 16+ 符号, 设备实证 8 分钟 12 次秒崩:
          #       Symbol not found: _$s10Foundation12CharacterSetV12charactersInACSSh_tcfC)
          # (b) 是通用判据, 不依赖符号名单, 上游将来引入新高版本扩展也自动兜住。
          APP="DerivedData/Build/Products/Release-iphoneos/Minis.app"
          if [ ! -d "$APP" ]; then
            APP=$(find DerivedData -name "Minis.app" -type d -exec du -sk {} + | sort -rn | head -1 | cut -f2)
          fi
          echo "=== 待处理 .app: $APP ==="
          python3 "$SCRIPT_DIR/strip_ios15_incompatible_extensions.py" "$APP"

      - name: "提交移植结果 (幂等, 且仅编译成功后才提交)"
        run: |
          # 关键: 本步骤必须在"编译 App"成功之后。
          # 之前它位于编译之前, 导致 1.14 移植编译失败时仍把约 300 个坏文件提交到 main,
          # 污染了 ios15-build.yml 所依赖的 src/ios (原本能正常出包的源码)。
          # 现在: 编译失败 -> 作业中止 -> 不提交 -> main 保持可用。
          # 只 add src/ios: 避免把编译产物 (DerivedData/deps) 一并提交。
          git config user.email "ios15-port@codebuddy.local"
          git config user.name "iOS15 Port Bot"
          git add -A src/ios
          if git diff --cached --quiet; then
            echo "无改动, 跳过提交"
          else
            git commit -m "Auto-port OpenMinis to iOS 15 (scripts @ $(git rev-parse --short HEAD))" || true
            git push || echo "WARN: push 失败(可能是分支保护), 不影响后续打包"
          fi

      - name: "打包 IPA (供 TrollStore 安装)"
        if: success()
        run: |
          set -e
          echo "=== 所有 Minis.app 候选及大小 ==="
          find DerivedData -name "Minis.app" -type d -exec du -sh {} + || true
          APP="DerivedData/Build/Products/Release-iphoneos/Minis.app"
          if [ ! -d "$APP" ]; then
            APP=$(find DerivedData -name "Minis.app" -type d -exec du -sk {} + | sort -rn | head -1 | cut -f2)
          fi
          echo "=== 选用: $APP ==="
          du -sh "$APP"
          if [ ! -f "$APP/Info.plist" ]; then echo "Info.plist 不存在, 打包中止"; exit 1; fi
          rm -rf Payload "Minis-iOS${{ env.DEPLOY_TARGET }}.ipa"
          mkdir -p Payload
          ditto "$APP" "Payload/Minis.app"

          # ============================================================
          # 写入 entitlements（关键）
          # ------------------------------------------------------------
          # 编译时是 CODE_SIGNING_ALLOWED=NO → 二进制不带任何权限；如果打包只是
          # 裸 zip，TrollStore 的安装预览里就看不到 App Group / Keychain 组，
          # group.com.openminis.app 容器也不会被创建，分享扩展、跨进程共享、
          # iSH 状态同步全部落空（"人家的包有、我的没有"就是这个原因）。
          # 这里按各 target 自己的 .entitlements 做 ad-hoc(fakesign) 签名，
          # TrollStore 安装时会读取并保留这些 entitlements。
          # ============================================================
          ENT_DIR="src/ios"
          dump_ent() {  # $1 = Mach-O
            if command -v ldid >/dev/null 2>&1; then
              ldid -e "$1" 2>/dev/null || true
            else
              codesign -d --entitlements :- "$1" 2>/dev/null || true
            fi
          }
          sign_macho() {  # $1 = Mach-O, $2 = entitlements 文件(可空)
            if [ -n "$2" ] && [ -f "$2" ]; then
              if command -v ldid >/dev/null 2>&1; then ldid -S"$2" "$1"
              else codesign --force --sign - --timestamp=none --entitlements "$2" "$1"; fi
            else
              if command -v ldid >/dev/null 2>&1; then ldid -S "$1"
              else codesign --force --sign - --timestamp=none "$1"; fi
            fi
          }

          MAIN_EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' Payload/Minis.app/Info.plist)
          echo "主可执行文件: $MAIN_EXE"
          echo "签名工具: $(command -v ldid || echo codesign)"

          # 1) 内层 Mach-O (dylib / framework / 原生依赖): 纯 ad-hoc
          find Payload -type f -perm -u+x ! -path "*.appex/*" | while read -r F; do
            case "$F" in "Payload/Minis.app/$MAIN_EXE") continue;; esac
            if file "$F" | grep -q "Mach-O"; then sign_macho "$F" ""; fi
          done

          # 2) 内嵌扩展 (.appex): 用 CFBundleIdentifier 末段匹配同名 .entitlements
          #    工程里的 bundle id 是 com.openminis.app.{ShareExtension|AgentWidget|FileProvider},
          #    与 entitlements 目录名一一对应。之前按"扩展目录名"匹配会完全对不上
          #    (构建产物叫 MinisShare / AgentWidgetExtension / MinisFileProvider),
          #    结果三个扩展都没拿到 App Group。排除主 App 的 Minis.entitlements。
          find Payload/Minis.app -maxdepth 3 -name "*.appex" -type d | while read -r APPEX; do
            EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APPEX/Info.plist" 2>/dev/null || basename "$APPEX" .appex)
            BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPEX/Info.plist" 2>/dev/null || basename "$APPEX" .appex)
            LAST=$(echo "$BID" | awk -F. '{print $NF}' | tr -d ' \r')
            ENT=""
            # a) 精确匹配: entitlements 文件名 == bundle id 末段
            for E in $(find "$ENT_DIR" -name "*.entitlements" ! -name "Minis.entitlements"); do
              S=$(basename "$E" .entitlements | tr 'A-Z' 'a-z')
              if [ "$S" = "$(echo "$LAST" | tr 'A-Z' 'a-z')" ]; then ENT="$E"; break; fi
            done
            # b) 兜底: 子串互含
            if [ -z "$ENT" ]; then
              for E in $(find "$ENT_DIR" -name "*.entitlements" ! -name "Minis.entitlements"); do
                S=$(basename "$E" .entitlements | tr 'A-Z' 'a-z')
                case "$(echo "$LAST" | tr 'A-Z' 'a-z')" in *"$S"*) ENT="$E"; break;; esac
              done
            fi
            echo "扩展 $(basename "$APPEX") (bundle=$BID) -> exe=$EXE ent=${ENT:-(无)}"
            sign_macho "$APPEX/$EXE" "$ENT"
          done

          # 2.5) [TrollStore 无沙盒全套] 在上游 entitlements 基础上合并注入。
          #      TrollStore 安装时原样保留这些键 (amfid 校验被 TrollStore 绕过)。
          #      效果: App 运行在沙盒外 → 可访问设备上所有数据容器 (所有容器都是
          #      mobile uid 的文件)、整个钥匙串组、以 root 权限执行内置 helper。
          # 开关: UNSANDBOX=1 才注入 (下轮若仍不兼容可直接置 0, 不用改代码)。
          # v19 教训: v18 加了 platform-application → App 启动即闪退打不开
          # (platform-application 让 SpringBoard 以平台应用身份启动它, 普通侧载
          #  App 不具备该身份的启动条件)。v19 只留解除沙盒真正需要的那一个键。
          echo "UNSANDBOX=${UNSANDBOX:-0}"
          MAIN_ENT="$ENT_DIR/Minis.entitlements"
          if [ "${UNSANDBOX:-0}" = "1" ] && [ -f "$MAIN_ENT" ]; then
            add_ent() { /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" "$MAIN_ENT" 2>/dev/null || echo "  (已存在: $1)"; }
            # 解除沙盒的核心键 (唯一必需):
            add_ent com.apple.private.security.no-sandbox bool true
            # 低风险辅助键:
            add_ent com.apple.private.skip-library-validation bool true
            echo "=== 主 App entitlements (合并无沙盒键后) ==="
            plutil -p "$MAIN_ENT" || cat "$MAIN_ENT"
          else
            echo "ℹ️ UNSANDBOX 未开启, 保持上游原始 entitlements (沙盒内运行)"
          fi

          # 3) 主 App (最后签, 带上 App Group / iCloud / HealthKit …)
          sign_macho "Payload/Minis.app/$MAIN_EXE" "$ENT_DIR/Minis.entitlements"

          # 4) 校验: 主 App 必须真的带上 App Group, 否则 TrollStore 不会创建容器
          ENTOUT=$(dump_ent "Payload/Minis.app/$MAIN_EXE")
          echo "--- 主 App entitlements ---"
          echo "$ENTOUT" | head -40
          if echo "$ENTOUT" | grep -q "group.com.openminis.app"; then
            echo "✅ 主 App 已带 App Group: group.com.openminis.app"
          else
            echo "❌ 主 App 未带上 App Group 权限 (TrollStore 将不会创建共享容器)"; exit 1
          fi
          if [ "${UNSANDBOX:-0}" = "1" ]; then
            if echo "$ENTOUT" | grep -q "no-sandbox"; then
              echo "✅ 无沙盒 entitlements 已嵌入 (沙盒外运行 / 全容器 / 全钥匙串)"
            else
              echo "❌ no-sandbox 未嵌入 —— 沙盒解除失败!"; exit 1
            fi
          else
            echo "ℹ️ UNSANDBOX=0, 本次为沙盒内运行包"
          fi
          for APPEX in $(find Payload/Minis.app -maxdepth 3 -name "*.appex" -type d); do
            EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APPEX/Info.plist" 2>/dev/null || basename "$APPEX" .appex)
            if dump_ent "$APPEX/$EXE" | grep -q "group.com.openminis.app"; then
              echo "✅ $(basename "$APPEX") 已带 App Group"
            else
              echo "⚠️  $(basename "$APPEX") 未带 App Group (该扩展可能无法与主 App 共享数据)"
            fi
          done

          zip -qry "Minis-iOS${{ env.DEPLOY_TARGET }}.ipa" Payload
          if ! unzip -l "Minis-iOS${{ env.DEPLOY_TARGET }}.ipa" | grep -q "Payload/Minis.app/Info.plist"; then
            echo "IPA 结构错误 (缺少 Payload/Minis.app/Info.plist)"; exit 1
          fi
          SIZE=$(stat -f%z "Minis-iOS${{ env.DEPLOY_TARGET }}.ipa")
          echo "IPA 大小: $SIZE 字节"
          if [ "$SIZE" -lt 10000000 ]; then echo "IPA 小于 10MB, 疑似空包, 中止上传"; exit 1; fi
          ls -lh "Minis-iOS${{ env.DEPLOY_TARGET }}.ipa"

      - name: "自检: IPA 不得含 iOS 15 不可启动的扩展 (dyld 体检)"
        if: success()
        run: |
          set -e
          IPA="Minis-iOS${{ env.DEPLOY_TARGET }}.ipa"
          BAD=0
          # ① AgentWidgetExtension: 链接 iOS 15.5 不存在的 _AppIntents_SwiftUI
          if unzip -l "$IPA" | grep -q "AgentWidgetExtension.appex"; then
            echo "❌ IPA 仍含 AgentWidgetExtension.appex (Library not loaded → dyld 启动崩溃)"
            BAD=1
          fi
          # ② MinisFileProvider: 被 fix_fileprovider_deployment.py 抬到 iOS 16.0,
          #    含 iOS 16+ 符号 (实测缺 CharacterSet.init(charactersIn:) 桥接桩),
          #    在 15.5 上被拉起即 SIGABRT (设备实证: 8 分钟 12 次秒崩)。
          if unzip -l "$IPA" | grep -q "MinisFileProvider.appex"; then
            echo "❌ IPA 仍含 MinisFileProvider.appex (Symbol not found → 每次被拉起就秒崩)"
            BAD=1
          fi
          if [ "$BAD" = "1" ]; then
            echo "--- IPA 内全部 appex ---"
            unzip -l "$IPA" | grep '\.appex/' | awk '{print $4}'
            exit 1
          fi
          echo "✅ IPA 已剔除全部 iOS 15 不可启动的扩展 (dyld 崩溃根因已移除)"
          echo "--- IPA 内剩余 appex (应为空或仅 15.5 可加载者) ---"
          unzip -l "$IPA" | grep '\.appex/' | awk '{print $4}' || echo "(无)"

      - name: "上传 IPA"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Minis-iOS${{ env.DEPLOY_TARGET }}-ipa
          path: Minis-iOS${{ env.DEPLOY_TARGET }}.ipa

      - name: "上传编译日志 (失败时排错用)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          if-no-files-found: ignore
