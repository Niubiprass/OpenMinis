            _v46_fields=$(python3 -c "t=open('src/ios/Views/Chat/SelectableMarkdownView.swift',encoding='utf-8').read(); ks=('_v46R = _t.attachmentBounds(','_v46AttWant += _v46R.height','_v46AttCached = _t.attV46CachedTotalH','_v46AttCachedW = _t.attV46CachedWidth','var _v46AttNVI = false','if _v46AttNVI == false, _t.needsLayoutInvalidation { _v46AttNVI = true }','_v46AttNVI ? 1 : 0','_v46Lm.numberOfGlyphs','if _v46AttN > 0 {','var attV46CachedTotalH','var attV46CachedWidth'); print('OK' if all(k in t for k in ks) else 'BAD:'+','.join(k for k in ks if k not in t))")
