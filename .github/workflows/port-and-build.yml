              exit 1
            fi
          echo "::group::断言42: v40 高度补齐必须在 polluted 判据**之前** (v39 实测: 宽度修好后早退, 高度代码一行没跑)"
          # v39 实测 (minis-2026-10-03 8.log, run#100) 的结论: **v39 修对了一半, 但补在了够不着的地方**。
          #   已修好: textView 自身 frameH == needH 现在 52/52 全对 (v38 时代 0/37) -> v18 那一层已正确。
          #   仍欠账: superview(sv0) 高度 52/52 全部小于 frameH, 欠 23.7~476pt, 零例外。
          # 根因: v39 把高度补齐写在了 `var fix = f` 之后, 而它**上面就是** `if !polluted { ... return false }`。
          # 而 polluted 判据只看宽度不看高度:
          #   superview宽=100000/1844.7/651.7 -> polluted=true  -> 高度被补OK
          #   superview宽=358.0(已正常)      -> polluted=false -> 早退, 高度一行没跑NG
          # 典型的「修好了 A, 结果 B 被 A 的成功挡住」的自噬结构。
          # 修法: 高度补齐提到 polluted 判据之前, 两段独立生效, 不再互相吃掉。
          if grep -q "V40-HEIGHT-UNCOND" src/ios/Views/Chat/SelectableMarkdownView.swift \
             && grep -q "_needH40 > 1" src/ios/Views/Chat/SelectableMarkdownView.swift \
             && grep -q "V40-HCHAIN" src/ios/Views/Chat/SelectableMarkdownView.swift ; then
            _v40_n=$(grep -c "_needH40 > 1" src/ios/Views/Chat/SelectableMarkdownView.swift || true)
            # 硬要求: 高度补齐必须落在 polluted 判据与 !polluted 早退**之前**, 否则等于没修。
            _v40_pos=$(python3 -c "t=open('src/ios/Views/Chat/SelectableMarkdownView.swift',encoding='utf-8').read(); h=t.index('_needH40 > 1'); p=t.index('let polluted = f.size.width > cvW + 1'); u=t.index('if !polluted {', p); e=t.index('return false', p); print('OK' if h<p<u<e else 'BAD')")
            # 反向断言: 诊断段必须用**补齐之前**的 f.size.height。若用补齐后的值,
            # 条件恒为 false, 诊断永远打不出来(等于埋了个哑巴)。
            _v40_diag=$(python3 -c "t=open('src/ios/Views/Chat/SelectableMarkdownView.swift',encoding='utf-8').read(); print('OK' if 'f.size.height + 0.5 < (ios15LastNeededH > 1' in t else 'BAD')")
            if [ "$_v40_n" = "1" ] && [ "$_v40_pos" = "OK" ] && [ "$_v40_diag" = "OK" ]; then
              echo "✅ v40 高度补齐已挪出 polluted 分支 (无条件执行 + 高度链诊断就位)"
            else
              echo "❌ v40 位置/数量异常 (注入点=$_v40_n 位置=$_v40_pos 诊断=$_v40_diag) —— 宽度修好后高度仍被早退跳过, 块重叠/半截字复发!"
              exit 1
            fi
          else
            echo "❌ v40 高度补齐缺失 —— superview 高度欠账 23.7~476pt 不修, 块与块重叠 + 文字只剩一半必然复发!"
            exit 1
          fi
          echo "::endgroup::"
          else
            echo "❌ v39 缺失 —— 帧同步每帧只改宽度不改高度, svH 恒为 needH 的 0.5~0.74, 排版必然不对!"
            exit 1
          fi
          echo "::group::断言43: v41 KVO 抢帧器必须补高度 (推翻 v39/v40 诊断: 欠账是 pass 之后被 SwiftUI 写回的)"
          # 【v41 的诊断反转 —— log9 逐行交叉比对】
          # v39/v40 都断定"高度补齐代码一次都没执行过"。**该结论是错的。**
          # 把 log9 里同一毫秒、**同一个 layoutSubviews 调用内**的两个日志点并排:
          #   07:28:44.501[LEFT-CLIP-FIX  v18] sv0=(16.0, 296.0, 100000.0, 1455.33)
          #   07:28:44.501  [LEFT-CLIP-DIAG2]    svFrame=(16.0, 296.0, 358.0, 2000.33)
          # _svf0 是函数**开头**抓的快照, DIAG2 在**同一函数末尾**读实时值 →
          # v18+v40 在这个 pass 内把几何**彻底修好了**(358 == 正确宽, 2000.33 == needH)。
          # 五组文本无一例外都是双值分布(327/936/252/664/1155), 修好后高度全部等于 needH。
          # V40-HCHAIN 打 0 次的原因: 它读 sv.frame 时值已经是对的, 条件恒为 false。
          #   → 诊断挂在"结果已修好"的那一层, 永远打不出来。同型第三次踩坑。
          #
          # 真凶: 抢帧的最后一环 ios15InstallKVO() 里的 block-KVO **只修 x/width,
          # 高度从不写**, 且 polluted 判据也只看宽度。于是 SwiftUI 布局收尾写回的
          # "宽度正常 + 高度欠账"帧被 `if !polluted { return }` 直接放过,
          # 末行被裁 → 用户症状: 字只剩一半 / 终端框结束不接结果。
          if grep -q "V41-KVOHEIGHT" src/ios/Views/Chat/SelectableMarkdownView.swift \
             && grep -q "V41-KVOFIXH" src/ios/Views/Chat/SelectableMarkdownView.swift \
             && grep -q "V41-DEBT" src/ios/Views/Chat/SelectableMarkdownView.swift ; then
            # 【加固·重要】位置判据必须锚**真正执行的赋值语句**, 不能锚注释标记。
            # 反向证伪(10/10)已证明: 锚注释时把注释挪走就骗过检查, 判据形同虚设。
            # 【v42 兼容】需求高度来源两代写法: v41 世代读 self.ios15LastNeededH,
            # v42 世代改读局部 _v42Need(闩锁缓存/KVO 自测)。v41 的**语义**必须继续
            # 被守住, 只是"从哪读"换了写法 —— 所以按产物实际写法选needle, 而不是
            # 因为v42 改了写法就删掉 v41 断言(那会让高度补齐彻底无人看守)。
            _v41_needle=$(python3 -c "t=open('src/ios/Views/Chat/SelectableMarkdownView.swift',encoding='utf-8').read(); print('_v42Need' if '_hFix.size.height = _v42Need' in t else 'self.ios15LastNeededH')")
            echo "v41 判据 needle = $_v41_needle"
            _v41_pos=$(python3 -c "t=open('src/ios/Views/Chat/SelectableMarkdownView.swift',encoding='utf-8').read(); n='_v42Need' if '_hFix.size.height = _v42Need' in t else 'self.ios15LastNeededH'; a=t.index('_hFix.size.height = '+n); h=t.index(chr(10)+'                f = _hFix'); p=t.index('let polluted = f.size.width > cvW + 1 || f.origin.x < -0.5 || _hDebt'); r=t.index(chr(10)+'                fix.size.height = '+n); w=t.index(chr(10)+'            obj.frame = fix', r); print('OK' if a<h<p<r<w else 'BAD')")
            # 判据必须含高度维度, 否则"宽度正常+高度欠账"仍被 !polluted 放过。
            _v41_dim=$(python3 -c "t=open('src/ios/Views/Chat/SelectableMarkdownView.swift',encoding='utf-8').read(); p=t.index('let polluted = f.size.width > cvW + 1 || f.origin.x < -0.5 || _hDebt'); print('OK' if '_hDebt' in t[p:p+120] else 'BAD')")
            # 编译正确性: KVO 闭包内必须 var f(v41 要f = _hFix 重新赋值), 且三元表达式
            # 两侧必须同类型(CGFloat vs Int 会直接编译失败)。
            _v41_swift=$(python3 -c "t=open('src/ios/Views/Chat/SelectableMarkdownView.swift',encoding='utf-8').read(); s=t.index('ios15KvoToken = sv.observe'); e=t.index('private var attachmentViews', s); g=t[s:e]; a='var f = obj.frame' in g; b=chr(10)+'            let f = obj.frame' not in g; c='CGFloat(0),' in t; print('OK' if a and b and c else 'BAD')")
            # 五条诊断必须都在 NSLog 里(锚 NSLog 字符串, 不锚注释)。
            _v41_diag=$(python3 -c "t=open('src/ios/Views/Chat/SelectableMarkdownView.swift',encoding='utf-8').read(); ms=['V41-KVOPRE','V41-KVOHEIGHT','V41-KVOPOST','V41-KVOFIXH','V41-DEBT']; print('OK' if all(t.count('NSLog(\"['+m+']')==1 for m in ms) else 'BAD')")
            # 反向断言: 兜底补高条件不得被阉割(改成 if false 之类)。
            # 【为什么单独断言】反向证伪 9 项里它曾漏掉 —— 位置判据锚的是赋值语句,
            # 把整个 if 体换成 `if false {` 后赋值语句仍在, 位置判据察觉不到。
            # 必须额外验"条件本身还在"。
            _v41_resc=$(python3 -c "t=open('src/ios/Views/Chat/SelectableMarkdownView.swift',encoding='utf-8').read(); n='_v42Need' if '_hFix.size.height = _v42Need' in t else 'self.ios15LastNeededH'; print('OK' if ('if '+n+' > 1, fix.size.height + 0.5 < '+n+' {') in t else 'BAD')")
            # 反向断言: 重入保护必须两处都在。补高度会二次触发 KVO, 没有它会无限递归。
            # 【为什么单独断言】同上, 改成 false 后赋值语句仍在, 位置判据漏。
            _v41_guard=$(python3 -c "t=open('src/ios/Views/Chat/SelectableMarkdownView.swift',encoding='utf-8').read(); s=t.index('ios15KvoToken = sv.observe'); e=t.index('private var attachmentViews', s); g=t[s:e]; print('OK' if g.count('ios15KvoFixing = true')==2 and g.count('ios15KvoFixing = false')==2 else 'BAD')")
            # 反向断言: 不得残留已废弃的 v41 注册方案(思路已被证伪, 残留=半吊子)。
            _v41_clean=$(python3 -c "t=open('src/ios/Views/Chat/SelectableMarkdownView.swift',encoding='utf-8').read(); print('OK' if 'V41-REGISTER' not in t and 'V41-TICK' not in t else 'BAD')")
            if [ "$_v41_pos" = "OK" ] && [ "$_v41_dim" = "OK" ] && [ "$_v41_swift" = "OK" ] && [ "$_v41_diag" = "OK" ] && [ "$_v41_clean" = "OK" ] && [ "$_v41_resc" = "OK" ] && [ "$_v41_guard" = "OK" ]; then
              echo "✅ v41 KVO 抢帧器已补高度 (无条件补高 + polluted 含高度维度 + 提交前兜底 + 5 条诊断就位)"
            else
              echo "❌ v41 异常 (位置=$_v41_pos 维度=$_v41_dim Swift=$_v41_swift 诊断=$_v41_diag 残留=$_v41_clean 兜底=$_v41_resc 重入=$_v41_guard) —— SwiftUI 写回的高度欠账仍无人拦截, 末行裁字必然复发!"
              exit 1
            fi
          else
            echo "❌ v41 KVO 补高度缺失 —— 抢帧器只修宽度, '宽度正常+高度欠账'的帧被 !polluted 放过, 字只剩一半/终端框不接结果必然复发!"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::断言44: v42 需求高度闩锁(带键缓存) + KVO 兜底自测 + 120ms 节流 (治'最后一段字卡住')"
          # v41 实测(log10)读数: KVO 抢帧器 94 次触发里 **77 次(82%) needH=0**,
          # 补齐条件 `needH > 1` 直接跳过, superview 卡在 1123.7/1006.0 恒定不变
          # (25 次同值采样), 末行持续被裁 → 用户症状「助手输出最后一段字卡住」。
          #
          # 根因: ios15LastNeededH 的唯一赋值点在 layoutSubviews 的
          # `if !isScrollEnabled, let rCv2 = findCollectionView(), rCv2.bounds.width > 1`
          # 内部, 三道门任一不满足就永远是 0; 而 KVO 抢帧器**不在这三道门里**,
          # 于是"抢帧器正常工作, 测量链没跟上"。
          if grep -q "V42-GATE" src/ios/Views/Chat/SelectableMarkdownView.swift \
             && grep -q "V42-LATCH" src/ios/Views/Chat/SelectableMarkdownView.swift \
             && grep -q "V42-MISS" src/ios/Views/Chat/SelectableMarkdownView.swift ; then
            # 位置判据锚**真正执行的赋值/条件语句**, 不锚注释(反向证伪31/31 已验证)。
            # 【v43 两代兼容】键里的宽度两代不同, 都必须带 self., 顺序不变:
            #   v42 世代: self.ios15LatchW = self.textContainer.size.width  (脏宽, 会造假高度)
            #   v43 世代: self.ios15LatchW = _realW2                        (抢回净宽, 与排版同源)
            # 判据两代都放行 —— 不能因 v43 改了写法就删 v42 判据(那等于让"三键刷新"无人看守),
            # 也不能只认 v42(那 v43 永远跑不过)。
            _v42_pos=$(python3 -c "t=open('src/ios/Views/Chat/SelectableMarkdownView.swift',encoding='utf-8').read(); N=chr(10); s=t.index('ios15LastNeededH = _needH'); a=t.index(N+'            self.ios15LatchedNeedH = _needH', s); b=t.index(N+'            self.ios15LatchLen = self.textStorage.length', s); w=N+'            self.ios15LatchW = _realW2'; w2=N+'            self.ios15LatchW = self.textContainer.size.width'; c=t.index(w, s) if w in t else t.index(w2, s); d=t.index(N+'            self.ios15LatchHash = self.textStorage.mutableString.hash', s); g=t.index('NSLog('+chr(34)+'[V42-GATE]'); f=t.index('if !isScrollEnabled, let rCv2 = findCollectionView(), rCv2.bounds.width > 1 {'); print('OK' if s<a<b<c<d and g<f else 'BAD')")
