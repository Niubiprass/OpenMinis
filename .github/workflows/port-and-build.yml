name: iOS15 移植并打包 IPA

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "最低系统版本 (iOS 15 用 15.5)"
        required: true
        default: "15.5"
      force_rebuild:
        description: "忽略脚本指纹, 强制重跑"
        required: false
        default: "yes"
        type: choice
        options: ["yes", "no"]
      upstream_ref:
        description: "上游版本锚点 (tag 或 commit sha)。默认钉死 1.14，只在 App Store 大版本新功能上线、你决定升级时改成新 tag (如 1.15)。平时小更新不要改。"
        required: false
        default: "1.14"
      unsandbox:
        description: "解除沙盒 (no-sandbox): 实测会让 Minis 启动即闪退 (v18/v19 教训), 保持 0; 仅在想实验时选 1"
        required: false
        default: "0"
        type: choice
        options: ["0", "1"]
  push:
    paths:
      - "scripts/ios15_port.py"
      - "scripts/ios15_port_v2.py"
      - "scripts/fix_fileprovider_deployment.py"
      - "scripts/ios15_runtime_fixes.py"
      - "scripts/autofix.py"
      - "scripts/ios15_fallback.py"
      - ".github/workflows/port-and-build.yml"

permissions:
  contents: write

jobs:
  port-and-build:
    runs-on: macos-latest
    env:
      # push 触发时 inputs 为空，统一用这个环境变量兜底
      DEPLOY_TARGET: ${{ inputs.deploy_target || '15.5' }}
      # 上游版本锚点：默认钉死 tag 1.14。push 触发 (无 inputs) 时回退到 1.14，
      # 避免上游 main 的小改动悄悄弄坏 TrollStore 包。只在你决定升级大版本时手动改。
      UPSTREAM_REF: ${{ inputs.upstream_ref || '1.14' }}
      # 在线脚本的源：就是把本仓库 scripts/ 目录当成"在线脚本库"。
      # 你在 GitHub 上直接改 scripts/*.py 并提交，下次 Run workflow 就生效。
      SCRIPT_REPO: ${{ github.repository }}
      SCRIPT_REF: ${{ github.ref_name }}
      SCRIPT_DIR: scripts
      # 是否给主 App 注入"解除沙盒"entitlements (TrollStore 保留)。
      # v20 实锤: no-sandbox 让 Minis 启动即闪退 (v18 platform-application / v19 仅
      # no-sandbox 两种形态都打不开, v17 沙盒内可正常打开)。默认 0 = 沙盒内运行。
      # 手动 Run workflow 选 1 可实验沙盒外运行, 但预计仍会启动崩溃。
      UNSANDBOX: ${{ inputs.unsandbox || '0' }}

    steps:
      - name: "检出仓库 (含子模块)"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: "打印本次脚本指纹 (确认用的是最新版)"
        run: |
          echo "在线脚本来源: $SCRIPT_REPO @ $SCRIPT_REF / $SCRIPT_DIR"
          for f in ios15_port.py ios15_port_v2.py ios15_runtime_fixes.py fix_fileprovider_deployment.py autofix.py; do
            if [ -f "$SCRIPT_DIR/$f" ]; then
              printf '  %-34s %s\n' "$f" "$(shasum -a 256 "$SCRIPT_DIR/$f" | cut -c1-16)"
            else
              echo "  $f 缺失!"; exit 1
            fi
          done
          echo "--- 版本号 ---"
          grep -m1 'SCRIPT_VERSION =' "$SCRIPT_DIR/ios15_port_v2.py" || true

      - name: "安装依赖工具"
        run: |
          set -e
          brew install ninja llvm lld libarchive pkg-config meson go || true
          # ldid: fakesign + 写 entitlements 用（打包 IPA 那步优先用它，
          # 取不到则回退到 macOS 自带 codesign）。取不到不影响构建。
          brew install ldid || true

          # meson 必须真的能用。踩过的坑（本次 push 构建就死在这）：
          #   pip install --user meson
          # 会把脚本装到 ~/Library/Python/3.x/bin，而这个目录**不在 PATH 里**，
          # 于是 build_ish.sh 报 "Meson is required" 直接退出。
          # 所以这里把候选目录全部显式塞进 GITHUB_PATH，最后再断言一次。
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/meson/bin" >> "$GITHUB_PATH"

          if ! command -v meson >/dev/null 2>&1; then
            # 优先用 pipx / brew 这种会自己塞进 PATH 的方式
            brew install meson || true
          fi
          if ! command -v meson >/dev/null 2>&1; then
            python3 -m pip install --user meson || \
              python3 -m pip install --break-system-packages meson || true
            # --user 安装位置随 Python 版本变（3.12/3.13/3.14…），动态探出来
            USERBASE=$(python3 -m site --user-base 2>/dev/null || echo "$HOME/.local")
            PYVER=$(python3 -c 'import sys;print("python%d.%d"%sys.version_info[:2])' 2>/dev/null || echo "")
            for d in "$USERBASE/bin" "$HOME/Library/Python/$PYVER/bin" "$HOME/Library/Python/3.14/bin"; do
              [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
            done
          fi
          echo "候选 meson 位置:"
          find "$HOME/Library/Python" "$HOME/.local" "$(brew --prefix)/bin" \
            -maxdepth 3 -name meson -type f 2>/dev/null | head

      - name: "验证工具链 (缺一即失败)"
        run: |
          set -e
          fail=0
          for t in meson ninja go clang; do
            if command -v "$t" >/dev/null 2>&1; then
              printf '✅ %-8s %s\n' "$t" "$(command -v $t)"
            else
              printf '❌ %-8s 找不到\n' "$t"; fail=1
            fi
          done
          [ "$fail" -eq 0 ] || { echo "工具链不完整，提前终止（免得白等一小时编译）"; exit 1; }
          meson --version
          ninja --version
          go version
          clang --version | head -1

      - name: "修复 lld 链接器可见性 (iSH 需要)"
        run: |
          sudo mkdir -p /usr/local/bin
          for base in "$(brew --prefix lld)/bin" "$(brew --prefix llvm)/bin"; do
            for t in ld.lld ld64.lld wasm-ld; do
              if [ -x "$base/$t" ]; then sudo ln -sf "$base/$t" "/usr/local/bin/$t"; fi
            done
          done
          which ld.lld
          ld.lld --version

      - name: "选 Xcode"
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: "拉取上游 OpenMinis 干净源码 (钉死 UPSTREAM_REF=$UPSTREAM_REF), 覆盖 src/ios"
        run: |
          set -e
          # 浅克隆的 git 历史里 src/ios 已被改过, 不能作为还原基线。
          # 直接从上游 OpenMinis 拉 tarball 覆盖, 保证每次从原文开始。
          # 锚点由 UPSTREAM_REF 控制: 默认 tag 1.14 (稳定, 不随上游小改漂动);
          # 想升级大版本时把它改成新 tag (如 1.15) 或 commit sha 再手动重跑。
          TMP=$(mktemp -d)
          OK=0
          for URL in \
            "https://codeload.github.com/OpenMinis/OpenMinis/tar.gz/$UPSTREAM_REF" \
            "https://github.com/OpenMinis/OpenMinis/archive/$UPSTREAM_REF.tar.gz" ; do
            echo "尝试: $URL"
            if curl -fsSL --retry 3 --retry-delay 3 --max-time 300 "$URL" -o "$TMP/up.tgz"; then
              OK=1; break
            fi
          done
          if [ "$OK" != "1" ]; then
            echo "❌ 上游 tarball 下载失败"; exit 1
          fi
          tar xzf "$TMP/up.tgz" -C "$TMP"
          SRC=$(find "$TMP" -maxdepth 1 -type d -name 'OpenMinis-*' | head -1)
          echo "上游解包目录: $SRC"
          if [ ! -d "$SRC/src/ios" ]; then echo "❌ 上游包结构异常"; exit 1; fi
          # 只覆盖 iOS 源码树, 保留仓库里的 deps/ 等
          rm -rf src/ios
          cp -R "$SRC/src/ios" src/ios
          echo "=== src/ios 文件数 ==="
          find src/ios -name '*.swift' | wc -l

      - name: "源码移植到 iOS 15 (第一阶段: 导航/弹窗)"
        run: python3 "$SCRIPT_DIR/ios15_port.py" src/ios

      - name: "源码移植到 iOS 15 (第二阶段: 本地化/Intents/兼容层)"
        run: python3 "$SCRIPT_DIR/ios15_port_v2.py"

      - name: "运行时修复 (Material→实心色 / 工具输出 LazyVStack / AppGroup 兜底 / PHPicker 桥接)"
        run: python3 "$SCRIPT_DIR/ios15_runtime_fixes.py"

      - name: "源码移植到 iOS 15 (第三阶段: 真实 iOS16/17 依赖兜底)"
        run: python3 "$SCRIPT_DIR/ios15_fallback.py" src/ios

      - name: "自检: 运行时补丁是否真的生效 (不通过则立即变红, 避免静默回归)"
        run: |
          set -e
          # 这些补丁用的是精确字符串锚点: 上游大改版后锚点可能失效,
          # 脚本只打 WARN 然后跳过, 构建照样绿、装上才崩。这里把"补丁未生效"
          # 变成硬性构建失败, 让回归在云端就暴露。

          echo "::group::断言1: App Group 强解包必须为 0 (否则 TrollStore 启动崩溃)"
          N=$(grep -rn "containerURL(forSecurityApplicationGroupIdentifier:.*!" src/ios | wc -l | tr -d ' ')
          if [ "$N" = "0" ]; then echo "✅ 强解包 = 0"; else echo "❌ 仍有 $N 处强解包, AppGroup 补丁未生效 (上游可能改了锚点)"; exit 1; fi
          echo "::endgroup::"

          echo "::group::断言2: 照片/文件按钮必须已桥接 (否则附件入口丢失)"
          P=$(grep -c "Button { showPhotoPicker = true }" src/ios/Views/Chat/AIChatView.swift 2>/dev/null | tr -d ' ')
          D=$(grep -c "Button { showDocumentPicker = true }" src/ios/Views/Chat/AIChatView.swift 2>/dev/null | tr -d ' ')
          if [ "$P" = "0" ] && [ "$D" = "0" ]; then echo "✅ 按钮已替换为 UIKit 桥接"; else echo "❌ 照片/文档按钮未替换 (P=$P D=$D), 上游可能改了按钮文案"; exit 1; fi
          echo "::endgroup::"

          echo "::group::断言3: 运行时补丁哨兵必须存在 (证明注入了 UIKit picker 类型)"
          if grep -q "iOS15_RUNTIME_FIX_APPLIED" src/ios/iOS15Compat.swift; then echo "✅ 哨兵存在"; else echo "❌ iOS15Compat 未注入 picker 类型, 补丁失效"; exit 1; fi
          echo "::endgroup::"

          echo "::group::断言4: ToolLiveSheet 不得全部变 LazyVStack (否则 iOS15 嵌套高度测量异常)"
          # 正确状态: 顶层容器用 LazyVStack, 但其内层容器保留为普通 VStack。
          # 危险状态: 全部变成 LazyVStack -> 出现嵌套 LazyVStack -> 内容静默消失。
          # 判定: 只要存在 LazyVStack, 就必须至少保留一些普通 VStack (内层未误改)。
          LAZY=$(grep -c "LazyVStack(alignment: .leading, spacing: 0) {" src/ios/Views/Chat/ToolLiveSheet.swift 2>/dev/null | tr -d ' ')
          INNER=$(grep -c "[^y]VStack(alignment: .leading, spacing: 0) {" src/ios/Views/Chat/ToolLiveSheet.swift 2>/dev/null | tr -d ' ')
          if [ "$LAZY" -gt 0 ] && [ "$INNER" -eq 0 ]; then
            echo "⚠️ 全部变 LazyVStack (Lazy=$LAZY, 内层 VStack=0), 疑似嵌套, 需人工确认"
          else
            echo "✅ 顶层 Lazy=$LAZY, 内层普通 VStack=$INNER (无全部-Lazy 的嵌套隐患)"
          fi
          echo "::endgroup::"

          echo "::group::断言5: 几何测量回填必须就位 (否则 inputBarHeight=0 → 最后一条消息被输入栏永久盖住)"
          # onGeometryChange 是 inputBarHeight/floatingBarHeight/topSafeAreaInset 的
          # 唯一来源。早期流水线把整调用删掉, 导致 inputBarHeight 恒为 0:
          # 消息列表底部不留空, 最后一条消息被输入栏挡住、滚不进可视区
          # ("执行任务字不会上移"), 底部还会渲染成一块黑区。
          # 现在改成改名调用 iOS15Compat.swift 里的回填实现, 这里做硬性回归拦截。
          N15=$(grep -rn "\.onGeometryChange15(" src/ios --include=*.swift | wc -l | tr -d ' ')
          LEFT=$(grep -rn "\.onGeometryChange(" src/ios --include=*.swift | wc -l | tr -d ' ')
          IMPL=$(grep -c "func onGeometryChange15" src/ios/iOS15Compat.swift 2>/dev/null | tr -d ' ')
          SEED=$(grep -c "inputBarHeight = newH" src/ios/Views/Chat/AIChatView.swift 2>/dev/null | tr -d ' ')
          echo "回填点=$N15 未处理=$LEFT 回填实现=$IMPL inputBarHeight写入点=$SEED"
          if [ "$LEFT" != "0" ]; then
            echo "❌ 仍有 $LEFT 处未处理的 .onGeometryChange( —— v2 的改名规则失效了"; exit 1
          fi
          if [ "$N15" -lt 5 ]; then
            echo "❌ 回填点只有 $N15 处 (应 ≥5: AIChatView 4 + ChatMessageViews 1)"; exit 1
          fi
          if [ "$IMPL" = "0" ]; then
            echo "❌ iOS15Compat.swift 缺 onGeometryChange15 回填实现"; exit 1
          fi
          if [ "$SEED" = "0" ]; then
            echo "❌ AIChatView 的 inputBarHeight 写入点丢失 (底部内边距会算错)"; exit 1
          fi
          echo "✅ 几何测量回填就位 ($N15 处)"
          echo "::endgroup::"

          echo "::group::断言6: iOS15 兜底 —— NSTextContainer 风暴熔断 + 高度钳制必须生效 (否则新对话发送主线程卡死)"
          G=src/ios/Shared/NSTextContainerSetSizeGuard.m
          if [ ! -f "$G" ]; then echo "❌ 找不到 $G"; exit 1; fi
          if grep -q "kStormForwardLimit = 40" "$G" && grep -q "kMaxContainerHeight = 1e5" "$G" && grep -q "storm-breaker SKIP" "$G" ; then
            echo "✅ 风暴熔断(kStormForwardLimit=40) + 1e5 高度钳制 + storm-breaker 已注入"
          else
            echo "❌ ios15_fallback 未生效: kStormForwardLimit / kMaxContainerHeight / storm-breaker 缺失 —— 主线程卡死修复没进包! 上游可能改了 NSTextContainerSetSizeGuard.m 锚点"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::断言7: iOS15 兜底 —— codeTextView 必须关闭 widthTracksTextView (否则超宽 setSize 风暴)"
          if grep -q "codeTextView.textContainer.widthTracksTextView = false" src/ios/Views/Chat/SelectableMarkdownView.swift ; then
            echo "✅ codeTextView 宽度不再跟随 frame"
          else
            echo "❌ codeTextView.widthTracksTextView 未关闭 —— 卡死修复没进包! 上游可能改了 SelectableMarkdownView.swift 锚点"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::断言8: v6 老会话双边裁字修复必须就位 (渲染端容器宽度钳回+强制重排)"
          if grep -q "IOS15-FIX-CLIP" src/ios/Views/Chat/SelectableMarkdownView.swift && grep -q "LEFT-CLIP-FIX" src/ios/Views/Chat/SelectableMarkdownView.swift ; then
            echo "✅ 左裁字渲染端修复已注入"
          else
            echo "❌ IOS15-FIX-CLIP 缺失 —— 老会话裁字修复没进包! 上游可能改了渲染函数锚点"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::断言9: v6 回复后大片空白修复必须就位 (大幅收缩修正立即生效)"
          if grep -q "IOS15-FIX-BLANK" src/ios/Views/Chat/SelectableMarkdownView.swift && grep -q "delta < -100" src/ios/Views/Chat/SelectableMarkdownView.swift ; then
            echo "✅ 大幅收缩不欠账已注入"
          else
            echo "❌ IOS15-FIX-BLANK 缺失 —— 空白修复没进包! 上游可能改了 isDeferred 块锚点"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::断言10: v14 老会话裁字/半截字/闪屏修复必须就位"
          if grep -q "_edgeTouch" src/ios/Views/Chat/SelectableMarkdownView.swift && grep -q "ios15LastSaneSVFrame" src/ios/Views/Chat/SelectableMarkdownView.swift ; then
            echo "✅ superview 污染/贴边帧判定 + 正常帧记录已注入"
          else
            echo "❌ IOS15-FIX-CLIP v3/v14 缺失 —— 老会话裁字真修复没进包! 上游可能改了渲染函数锚点"
            exit 1
          fi
          if grep -q "textContainerInset = UIEdgeInsets" src/ios/Views/Chat/SelectableMarkdownView.swift ; then
            echo "✅ v14 贴边内边距适应已注入 (不再抢 SwiftUI frame → 消除拉锯闪屏闪字)"
          else
            echo "❌ v14 贴边内边距适应缺失 —— 抢 frame 的拉锯仍在, 闪屏闪字未修!"
            exit 1
          fi
          if grep -q "ios15LastNeededH" src/ios/Views/Chat/SelectableMarkdownView.swift ; then
            echo "✅ v14 高度欠账修复已注入 (按 usedRect 撑高, 修老会话半截字)"
          else
            echo "❌ v14 高度欠账修复缺失 —— 老会话最后一行被拦腰裁断未修!"
            exit 1
          fi
          # v14 有意为撑高算一次 ensureLayout; 闪字的真凶是 setNeedsLayout (重排风暴),
          # 在注入块作用域内精确判定才算数 (文件本俸就有别的 setNeedsLayout)。
          if python3 -c "t=open('src/ios/Views/Chat/SelectableMarkdownView.swift',encoding='utf-8').read(); s=t.find('[IOS15-FIX-CLIP v14] 状态判定'); e=t.find('[LEFT-CLIP-DIAG2]'); raise SystemExit(0 if 0<s<e and 'setNeedsLayout(' not in t[s:e] else 1)"; then
            echo "✅ v14 注入块内无 setNeedsLayout —— 重排风暴 (闪字元凶) 已根除"
          else
            echo "❌ v14 注入块内仍有 setNeedsLayout —— 重排风暴会复发!"
            exit 1
          fi
          echo "::group::断言11: AgentWidgetExtension 必须弱链接 AppIntents+ActivityKit (iOS15.5 无这两个框架, 强链接 → dyld 崩)"
          # 注意路径: ios15_fallback.py 以 ROOT=src/ios 运行, pbxproj 在 src/ios/ 下
          if grep -q '"-weak_framework",' src/ios/Minis.xcodeproj/project.pbxproj && grep -q "AppIntents," src/ios/Minis.xcodeproj/project.pbxproj ; then
            echo "✅ AppIntents / ActivityKit 弱链接已写入 widget target (dyld 不再 Library missing)"
          else
            echo "❌ AppIntents 弱链接缺失 —— AgentWidgetExtension 会 Library not loaded 崩溃!"
            exit 1
          fi
          if grep -q "newSize.width > 1e5" src/ios/Shared/NSTextContainerSetSizeGuard.m ; then
            echo "✅ 容器宽度上限已降到 1e5"
          else
            echo "❌ 容器宽度上限未降到 1e5 —— 1e7 宽度仍会让 CoreText 近乎无限排版! 上游可能改了 guard 锚点"
            exit 1
          fi
          echo "::group::断言12: v17 测量宽必须钳到 cvW-32 与渲染端一致 (消末行裁半/上下空白/污染帧拉锯)"
          if grep -q "measCapW15" src/ios/iOS15Compat.swift ; then
            echo "✅ ios15FittingSize 有限超界宽度钳制已就位 (替身 cell 自排版)"
          else
            echo "❌ ios15FittingSize v17 钳制缺失 —— cell 高度仍按污染宽(494)算, 末行裁半/空白复发!"
            exit 1
          fi
          if grep -q "measCapW" src/ios/Views/Chat/SelectableMarkdownView.swift && grep -q "capW15UAV" src/ios/Views/Chat/SelectableMarkdownView.swift ; then
            echo "✅ invalidateCellSize/attachment 测量宽钳到 cvW-32 已就位"
          else
            echo "❌ 测量宽 v17 钳制缺失 —— 测量(390/494)≠渲染(358), 高度对不上!"
            exit 1
          fi
          echo "::group::断言14: v21 intrinsicContentSize 理想宽钳制必须就位 (堵住 1e5 泄露 → 污染帧 x=-49805)"
          if grep -q "override var intrinsicContentSize" src/ios/Views/Chat/SelectableMarkdownView.swift && grep -q "cvW > 33 ? cvW - 32 : sz.width" src/ios/Views/Chat/SelectableMarkdownView.swift ; then
            echo "✅ 理想宽已钳到真实可用宽 (污染源 1e5 不再进入布局)"
          else
            echo "❌ intrinsicContentSize 钳制缺失 —— 气泡仍会被布局成宽 100000 / x=-49805, 闪字与空白复发!"
            exit 1
          fi
          echo "::group::断言15: v22 SwiftUI rootView maxWidth 必须就位 (压住超宽理想宽 → 根除污染帧)"
          if grep -q "frame(maxWidth: _ios15ContentMaxW" src/ios/iOS15Compat.swift ; then
            echo "✅ SwiftUI 内容最大宽度已设 (理想宽不再 100032/2378, x=-49805 污染帧不再产生)"
          else
            echo "❌ v22 maxWidth 未注入 —— 超宽理想宽仍会把气泡布局到 x=-49805, 闪字/空白复发!"
            exit 1
          fi
          echo "::group::断言16: v23 CADisplayLink 帧同步修正必须就位 (保证每帧绘制前几何已修正 → 视觉不闪)"
          if grep -q "ios15FrameFixTick" src/ios/Views/Chat/SelectableMarkdownView.swift && grep -q "CADisplayLink" src/ios/Views/Chat/SelectableMarkdownView.swift ; then
            echo "✅ 帧同步修正已注入 (渲染前拉回, 污染帧不会出现在屏幕上)"
          else
            echo "❌ v23 帧同步修正缺失 —— 污染帧仍会被渲染出去一帧, 闪字复发!"; exit 1
          fi
          echo "::group::断言17: v24 hosting 视图硬钉宽度必须就位 (根除 730/100000 超宽气泡 → 字不显示/空白/闪字)"
          if grep -q "ios15AvailW" src/ios/iOS15Compat.swift ; then
            echo "✅ hosting 视图宽度已硬钉 (=可用宽+裁切溢出), 表格/代码块节点不再撑爆气泡, 字不显示/空白/闪字根除"
          else
            echo "❌ v24 硬钉宽度缺失 —— 气泡仍会被表格/代码块撑到 730/100000, 字不显示/空白/闪字复发!"; exit 1
          fi
          echo "::group::断言18: v25 高度死锁修复必须就位 (textContainer 高放开重算 usedRect → 根除末行半截字/整条不显示)"
          if grep -q "ios15LastGoodFitH" src/ios/iOS15Compat.swift && grep -q "_realW2 = max(200.0, _cvW - 32)" src/ios/Views/Chat/SelectableMarkdownView.swift ; then
            echo "✅ v25 已注入: 测量 0 高度回退 + 渲染端放开容器高重算 usedRect, 半截字/不显示根除"
          else
            echo "❌ v25 高度修复缺失 —— usedRect 仍被 textContainer 高度死锁, 末行半截字/整条不显示复发!"; exit 1
          fi
          echo "::group::断言13: v18 KVO 抢帧必须就位 (污染帧在渲染前被改回, 消抢帧拉锯闪烁)"
          if grep -q "ios15InstallKVO" src/ios/Views/Chat/SelectableMarkdownView.swift && grep -q "NSKeyValueObservation" src/ios/Views/Chat/SelectableMarkdownView.swift ; then
            echo "✅ KVO 抢帧已注入"
          else
            echo "❌ KVO 抢帧缺失 —— 污染帧仍会渲染出去一帧, 闪字复发!"; exit 1
          fi
          echo "::endgroup::"

      - name: "设置部署目标 (主 App=${{ env.DEPLOY_TARGET }}, 扩展单独抬高)"
        run: |
          set -e
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = ${{ env.DEPLOY_TARGET }};/g' src/ios/Minis.xcodeproj/project.pbxproj
          python3 "$SCRIPT_DIR/fix_fileprovider_deployment.py"
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig 2>/dev/null || true
          echo "=== 部署目标分布 ==="
          grep -n "IPHONEOS_DEPLOYMENT_TARGET" src/ios/Minis.xcodeproj/project.pbxproj | head

      - name: "编译原生依赖 (LAME/FFmpeg/iSH/Alpine/RClone)"
        run: |
          set -e
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          sed -i '' 's/-miphoneos-version-min=[0-9.]*/-miphoneos-version-min=${{ env.DEPLOY_TARGET }}/; s/-mios-simulator-version-min=[0-9.]*/-mios-simulator-version-min=${{ env.DEPLOY_TARGET }}/' deps/build_rclone_ios.sh
          ./deps/build_rclone_ios.sh

      - name: "编译 App (不签名)"
        run: |
          set -e
          echo "============ 编译 (Release / iOS) ============"
          xcodebuild -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath DerivedData build > build.log 2>&1
          echo "=== 编译错误行 (error:, 最多 80 条) ==="
          grep -n "error:" build.log | grep -v "0 errors" | head -80 || true
          echo "编译成功"

      - name: "提交移植结果 (幂等, 且仅编译成功后才提交)"
        run: |
          # 关键: 本步骤必须在"编译 App"成功之后。
          # 之前它位于编译之前, 导致 1.14 移植编译失败时仍把约 300 个坏文件提交到 main,
          # 污染了 ios15-build.yml 所依赖的 src/ios (原本能正常出包的源码)。
          # 现在: 编译失败 -> 作业中止 -> 不提交 -> main 保持可用。
          # 只 add src/ios: 避免把编译产物 (DerivedData/deps) 一并提交。
          git config user.email "ios15-port@codebuddy.local"
          git config user.name "iOS15 Port Bot"
          git add -A src/ios
          if git diff --cached --quiet; then
            echo "无改动, 跳过提交"
          else
            git commit -m "Auto-port OpenMinis to iOS 15 (scripts @ $(git rev-parse --short HEAD))" || true
            git push || echo "WARN: push 失败(可能是分支保护), 不影响后续打包"
          fi

      - name: "打包 IPA (供 TrollStore 安装)"
        if: success()
        run: |
          set -e
          echo "=== 所有 Minis.app 候选及大小 ==="
          find DerivedData -name "Minis.app" -type d -exec du -sh {} + || true
          APP="DerivedData/Build/Products/Release-iphoneos/Minis.app"
          if [ ! -d "$APP" ]; then
            APP=$(find DerivedData -name "Minis.app" -type d -exec du -sk {} + | sort -rn | head -1 | cut -f2)
          fi
          echo "=== 选用: $APP ==="
          du -sh "$APP"
          if [ ! -f "$APP/Info.plist" ]; then echo "Info.plist 不存在, 打包中止"; exit 1; fi
          rm -rf Payload "Minis-iOS${{ env.DEPLOY_TARGET }}.ipa"
          mkdir -p Payload
          ditto "$APP" "Payload/Minis.app"

          # ============================================================
          # 写入 entitlements（关键）
          # ------------------------------------------------------------
          # 编译时是 CODE_SIGNING_ALLOWED=NO → 二进制不带任何权限；如果打包只是
          # 裸 zip，TrollStore 的安装预览里就看不到 App Group / Keychain 组，
          # group.com.openminis.app 容器也不会被创建，分享扩展、跨进程共享、
          # iSH 状态同步全部落空（"人家的包有、我的没有"就是这个原因）。
          # 这里按各 target 自己的 .entitlements 做 ad-hoc(fakesign) 签名，
          # TrollStore 安装时会读取并保留这些 entitlements。
          # ============================================================
          ENT_DIR="src/ios"
          dump_ent() {  # $1 = Mach-O
            if command -v ldid >/dev/null 2>&1; then
              ldid -e "$1" 2>/dev/null || true
            else
              codesign -d --entitlements :- "$1" 2>/dev/null || true
            fi
          }
          sign_macho() {  # $1 = Mach-O, $2 = entitlements 文件(可空)
            if [ -n "$2" ] && [ -f "$2" ]; then
              if command -v ldid >/dev/null 2>&1; then ldid -S"$2" "$1"
              else codesign --force --sign - --timestamp=none --entitlements "$2" "$1"; fi
            else
              if command -v ldid >/dev/null 2>&1; then ldid -S "$1"
              else codesign --force --sign - --timestamp=none "$1"; fi
            fi
          }

          MAIN_EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' Payload/Minis.app/Info.plist)
          echo "主可执行文件: $MAIN_EXE"
          echo "签名工具: $(command -v ldid || echo codesign)"

          # 1) 内层 Mach-O (dylib / framework / 原生依赖): 纯 ad-hoc
          find Payload -type f -perm -u+x ! -path "*.appex/*" | while read -r F; do
            case "$F" in "Payload/Minis.app/$MAIN_EXE") continue;; esac
            if file "$F" | grep -q "Mach-O"; then sign_macho "$F" ""; fi
          done

          # 2) 内嵌扩展 (.appex): 用 CFBundleIdentifier 末段匹配同名 .entitlements
          #    工程里的 bundle id 是 com.openminis.app.{ShareExtension|AgentWidget|FileProvider},
          #    与 entitlements 目录名一一对应。之前按"扩展目录名"匹配会完全对不上
          #    (构建产物叫 MinisShare / AgentWidgetExtension / MinisFileProvider),
          #    结果三个扩展都没拿到 App Group。排除主 App 的 Minis.entitlements。
          find Payload/Minis.app -maxdepth 3 -name "*.appex" -type d | while read -r APPEX; do
            EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APPEX/Info.plist" 2>/dev/null || basename "$APPEX" .appex)
            BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPEX/Info.plist" 2>/dev/null || basename "$APPEX" .appex)
            LAST=$(echo "$BID" | awk -F. '{print $NF}' | tr -d ' \r')
            ENT=""
            # a) 精确匹配: entitlements 文件名 == bundle id 末段
            for E in $(find "$ENT_DIR" -name "*.entitlements" ! -name "Minis.entitlements"); do
              S=$(basename "$E" .entitlements | tr 'A-Z' 'a-z')
              if [ "$S" = "$(echo "$LAST" | tr 'A-Z' 'a-z')" ]; then ENT="$E"; break; fi
            done
            # b) 兜底: 子串互含
            if [ -z "$ENT" ]; then
              for E in $(find "$ENT_DIR" -name "*.entitlements" ! -name "Minis.entitlements"); do
                S=$(basename "$E" .entitlements | tr 'A-Z' 'a-z')
                case "$(echo "$LAST" | tr 'A-Z' 'a-z')" in *"$S"*) ENT="$E"; break;; esac
              done
            fi
            echo "扩展 $(basename "$APPEX") (bundle=$BID) -> exe=$EXE ent=${ENT:-(无)}"
            sign_macho "$APPEX/$EXE" "$ENT"
          done

          # 2.5) [TrollStore 无沙盒全套] 在上游 entitlements 基础上合并注入。
          #      TrollStore 安装时原样保留这些键 (amfid 校验被 TrollStore 绕过)。
          #      效果: App 运行在沙盒外 → 可访问设备上所有数据容器 (所有容器都是
          #      mobile uid 的文件)、整个钥匙串组、以 root 权限执行内置 helper。
          # 开关: UNSANDBOX=1 才注入 (下轮若仍不兼容可直接置 0, 不用改代码)。
          # v19 教训: v18 加了 platform-application → App 启动即闪退打不开
          # (platform-application 让 SpringBoard 以平台应用身份启动它, 普通侧载
          #  App 不具备该身份的启动条件)。v19 只留解除沙盒真正需要的那一个键。
          echo "UNSANDBOX=${UNSANDBOX:-0}"
          MAIN_ENT="$ENT_DIR/Minis.entitlements"
          if [ "${UNSANDBOX:-0}" = "1" ] && [ -f "$MAIN_ENT" ]; then
            add_ent() { /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" "$MAIN_ENT" 2>/dev/null || echo "  (已存在: $1)"; }
            # 解除沙盒的核心键 (唯一必需):
            add_ent com.apple.private.security.no-sandbox bool true
            # 低风险辅助键:
            add_ent com.apple.private.skip-library-validation bool true
            echo "=== 主 App entitlements (合并无沙盒键后) ==="
            plutil -p "$MAIN_ENT" || cat "$MAIN_ENT"
          else
            echo "ℹ️ UNSANDBOX 未开启, 保持上游原始 entitlements (沙盒内运行)"
          fi

          # 3) 主 App (最后签, 带上 App Group / iCloud / HealthKit …)
          sign_macho "Payload/Minis.app/$MAIN_EXE" "$ENT_DIR/Minis.entitlements"

          # 4) 校验: 主 App 必须真的带上 App Group, 否则 TrollStore 不会创建容器
          ENTOUT=$(dump_ent "Payload/Minis.app/$MAIN_EXE")
          echo "--- 主 App entitlements ---"
          echo "$ENTOUT" | head -40
          if echo "$ENTOUT" | grep -q "group.com.openminis.app"; then
            echo "✅ 主 App 已带 App Group: group.com.openminis.app"
          else
            echo "❌ 主 App 未带上 App Group 权限 (TrollStore 将不会创建共享容器)"; exit 1
          fi
          if [ "${UNSANDBOX:-0}" = "1" ]; then
            if echo "$ENTOUT" | grep -q "no-sandbox"; then
              echo "✅ 无沙盒 entitlements 已嵌入 (沙盒外运行 / 全容器 / 全钥匙串)"
            else
              echo "❌ no-sandbox 未嵌入 —— 沙盒解除失败!"; exit 1
            fi
          else
            echo "ℹ️ UNSANDBOX=0, 本次为沙盒内运行包"
          fi
          for APPEX in $(find Payload/Minis.app -maxdepth 3 -name "*.appex" -type d); do
            EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APPEX/Info.plist" 2>/dev/null || basename "$APPEX" .appex)
            if dump_ent "$APPEX/$EXE" | grep -q "group.com.openminis.app"; then
              echo "✅ $(basename "$APPEX") 已带 App Group"
            else
              echo "⚠️  $(basename "$APPEX") 未带 App Group (该扩展可能无法与主 App 共享数据)"
            fi
          done

          zip -qry "Minis-iOS${{ env.DEPLOY_TARGET }}.ipa" Payload
          if ! unzip -l "Minis-iOS${{ env.DEPLOY_TARGET }}.ipa" | grep -q "Payload/Minis.app/Info.plist"; then
            echo "IPA 结构错误 (缺少 Payload/Minis.app/Info.plist)"; exit 1
          fi
          SIZE=$(stat -f%z "Minis-iOS${{ env.DEPLOY_TARGET }}.ipa")
          echo "IPA 大小: $SIZE 字节"
          if [ "$SIZE" -lt 10000000 ]; then echo "IPA 小于 10MB, 疑似空包, 中止上传"; exit 1; fi
          ls -lh "Minis-iOS${{ env.DEPLOY_TARGET }}.ipa"

      - name: "上传 IPA"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Minis-iOS${{ env.DEPLOY_TARGET }}-ipa
          path: Minis-iOS${{ env.DEPLOY_TARGET }}.ipa

      - name: "上传编译日志 (失败时排错用)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          if-no-files-found: ignore
