            _v46_pos=$(python3 -c "t=open('src/ios/Views/Chat/SelectableMarkdownView.swift',encoding='utf-8').read(); a=t.index('// [V45-TVHFIX]') if '// [V45-TVHFIX]' in t else -1; b=t.index('// [V46-ATTACH] 表格附件高度') if '// [V46-ATTACH] 表格附件高度' in t else -1; c=t.index('// [V44-TEXTFRAME] 见函数 docstring') if '// [V44-TEXTFRAME] 见函数 docstring' in t else -1; print('OK' if (a>=0 and b>a and c>b) else 'BAD v45@%d v46@%d v44@%d'%(a,b,c))")
