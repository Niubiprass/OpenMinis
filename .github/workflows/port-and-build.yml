          if grep -q "capW15UAV" src/ios/Views/Chat/SelectableMarkdownView.swift && grep -q "if let _lastW = ios15LastRenderContentW, _lastW > 200 { return _lastW }" src/ios/Views/Chat/SelectableMarkdownView.swift ; then
            echo "✅ attachment 测量宽钳制 + 测高宽复用渲染端 contentW 已就位"
          else
