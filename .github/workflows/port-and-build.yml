          fi
          echo "::group::断言41: v39 帧同步必须补上高度 (v38 实测: 帧同步只修宽度, 每帧把 v18 撑好的高度改回去)"
          # v38 实测 (minis-2026-10-03 7.log) 的结论: v38-A 的**诊断对了, 修法错了**。
          # 量化: svH 恒定落在 needH 的 0.50~0.74, 37/37 无一例外, 且 svH 恒等于 frameH。
          #   svW= 829.3 svH= 313.3 needH= 480.3  欠账=167.0 ×12
          #   svW=100000  svH= 669.0 needH= 901.3  欠账=232.3 ×8
          #   svW=1226.3  svH= 377.7 needH= 758.7  欠账=381.0 ×4
          # 根因: 两条修复路径各修一半 ——
          #   v18 layoutSubviews  修宽度 + 修高度(中间写, 会被下一帧覆盖)
          #   v23 帧同步          只修宽度(函数体内 height 字样 = 0 命中, 是最后一写)
          # 而末行裁切是**高度**不足造成的, 只修宽度永远治不好。
          # 修法: 在帧同步(最后一写)里一并把高度撑到 ios15LastNeededH。
          if grep -q "V39-FIXHEIGHT" src/ios/Views/Chat/SelectableMarkdownView.swift \
             && grep -q "_needH39 > 1" src/ios/Views/Chat/SelectableMarkdownView.swift \
             && grep -q "fix.size.height = _needH39" src/ios/Views/Chat/SelectableMarkdownView.swift ; then

            # 反向断言 1: 注入点必须唯一 —— 帧同步每帧对每个注册视图跑一次,
            #多处注入 = 每帧多次写 frame, 反而更卡。
            _v39_n=$(grep -c "_needH39 > 1" src/ios/Views/Chat/SelectableMarkdownView.swift || true)
            # 反向断言 2: 必须落在 sv.frame = fix **之前** —— 写在之后就永远不生效。
            _v39_pos=$(python3 -c "t=open('src/ios/Views/Chat/SelectableMarkdownView.swift',encoding='utf-8').read(); m=t.index('V39-FIXHEIGHT'); f=t.index('ios15ApplyFrameFix'); w=t.index('sv.frame = fix', m); print('OK' if f<m<w else 'BAD')")
            if [ "$_v39_n" = "1" ] && [ "$_v39_pos" = "OK" ]; then
