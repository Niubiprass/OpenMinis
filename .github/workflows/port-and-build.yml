            _v44_order=$(python3 -c "t=open('scripts/ios15_fallback.py',encoding='utf-8').read(); b=t[t.index('def main()'):]; a=b.find('fix_needh_latch_v42'); c=b.find('fix_diag_textframe_v44'); d=b.find('fix_kvo_height_clamp_v41'); print('OK' if (a>=0 and c>a and d>=0 and c>d) else 'BAD')")
