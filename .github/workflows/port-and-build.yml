          #   41.595 V570-KVOCW    dirty=1 netW=358.0              ← v57.1 纠偏确实执行了
          #   41.598 V49-WWRITER   kvoW=390.0 laidW=-1.0           ← 同一 tick 读回还是 390
          #   41.599 V44-TEXTFRAME tvW=390.0 svW=358.0 tcW=390.0  ← 落屏那版就是 390
          #   41.599 V41-KVOHEIGHT usedH=258.7 needH=387.0         ← 欠 128.3pt(≈6 行)
          # ⇒ **纠偏没白做, 但排版没重排**。v48 自己的注释里早就写明:
          #   改容器宽只改容器, 不动已排好的行碎片。
          #   ⇒ 必须紧跟一次 invalidateLayout, 且**必须在 if _v570Dirty 块内**:
          #     块外 = 每帧全量重排(掉帧); 块内 = 只在 SwiftUI 真推脏了宽度时排。
          #
          # 【为什么 v58 判据自己有 6 层, 3 层是本项目血的教训】
          #   第 5 层(纪律54): v58 块位置在 v49 探针**之前**。v49 的 S7/S8/S12
          #     三条 sabotage 都按「首个出现处」替换 size.height 成员访问, 注释里
          #     写一次就把变异体吸走 ⇒ v49 3/12 未拦 ⇒ CI 变红(真实发生)。
          #   第 6 层(纪律55): v50 判据用全文正则数「容器宽赋值」字面量并硬编码
          #     期望 5 处, **注释同样计入**。v58 注释里写一次就变 6 ⇒ CI 变红
          #     (真实发生, 同一个根因第三次)。故本层直接数 V58_ANCHOR_NEW 全文。
          #   第 3 层: invalidateLayout 的签名必须与 v28 段(第 8835 行)已验证的
          #     形式**逐字**一致 —— 判据里只允许出现编译器已验证存在的 API。
          if grep -q "fix_kvo_reflow_v58" "$SCRIPT_DIR/ios15_fallback.py" \
             && grep -q "verify_kvo_reflow_v58" "$SCRIPT_DIR/ios15_fallback.py" ; then
            if OPENMINIS_UPSTREAM_IOS="$PWD/.upstream-ios" \
               python3 "$SCRIPT_DIR/ios15_verify/ci_assert_v58.py" . ; then
              echo "✅ v58 就位 (4 层全绿: core 6层 / scope 编译级 / sab 反向 8 条 / scope自证 5 条)"
            else
              echo "::error::v58 判据异常 —— 纠偏后没有重排 = 卡字一定还在"
              echo "   —— 报「F1/块内无重排」: 回到 v57.1 形态(只改容器宽, 行碎片不重排 ⇒ 整行缺失)"
              echo "   —— 报「F2/F3/块外重排」: invalidateLayout 写在了 if _v570Dirty 外面 ⇒ 每帧全量重排(掉帧)"
              echo "   —— 报「纪律54」: v58 段注释里写了 size.height 成员访问 ⇒ v49 判据已被吸走"
              echo "   —— 报「纪律55」: v58 段注释里写了容器宽赋值字面量 ⇒ v50 判据计数会变 6"
              echo "   —— 报「sab 漏过」: 判据本身有洞, 等于没人看守"
              exit 1
            fi
          else
            echo "::error::ios15_fallback.py 里找不到 fix_kvo_reflow_v58 / verify_kvo_reflow_v58"
            exit 1
          fi
          echo "::endgroup::"

          # ============================================================
          # 断言 62: v60 采用 zhaoxiufei/OpenMinis 3ccdff6 已验证方案
          #          (宽跟随保留 + sane 宽推导链) —— 取代 v59 断源版
          # ============================================================
          # 【出处】用户截图实证 zhaoxiufei 的包在 iOS 15.1.1/15.4.1 真机
          #   上聊天渲染无卡字; v31~v59 的容器层对抗 30 余版从未被真机
          #   验证成功(41.595 写 358 → 41.598 被 frame(390) 顶回)。
          # 【哲学】不再对抗宽跟随: 保留上游 true, 用 hosting 层 +
          #   TextView 四层重写保证 frame 恒 sane, 跟随自然得到净宽。
          # 【核账】跟随宽应恰 2(init+表格内联); 关闭跟随应恰 1(codeTextView
          #   v4); v59 的 [V59-NOTRACK] 必须 0 —— 断源与宽跟随不能并存。
          if grep -q "fix_zhao_md_v60" "$SCRIPT_DIR/ios15_fallback.py" \
             && grep -q "fix_zhao_compat_v60" "$SCRIPT_DIR/ios15_fallback.py" ; then
            if grep -q "\[V60-ZHAO-INIT\]" src/ios/Views/Chat/SelectableMarkdownView.swift \
               && grep -q "\[V60-ZHAO-HOST\]" src/ios/iOS15Compat.swift ; then
              if OPENMINIS_UPSTREAM_IOS="$PWD/.upstream-ios" \
                 python3 "$SCRIPT_DIR/ios15_verify/reverse_v60.py" ; then
                echo "✅ v60 就位 (反向 11 条全拦: 摘 override/v21 复辟/v59 残魂/删兜底/阈值失效/裸宽/悬空引用)"
              else
                echo "::error::v60 判据异常 —— zhaoxiufei 方案注入不完整"
                echo "   —— 报「跟随宽 N 处」: v59 残魂(init 必须是 true)或范围失控"
                echo "   —— 报「缺 override」: sizeThatFits/intrinsic 重写块被破坏"
                echo "   —— 报「v21 特征仍在」: 旧钳宽版没替换干净=重复声明编译失败"
                exit 1
              fi
            else
              echo "::error::产物里没有 [V60-ZHAO-INIT]/[V60-ZHAO-HOST] —— v60 注入没生效(上游结构可能变了)"
              exit 1
            fi
          else
            echo "::error::ios15_fallback.py 里找不到 fix_zhao_md_v60 / fix_zhao_compat_v60"
            exit 1
          fi
          echo "::endgroup::"

      - name: "设置部署目标 (主 App=${{ env.DEPLOY_TARGET }}, 扩展单独抬高)"
        run: |
          set -e
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = ${{ env.DEPLOY_TARGET }};/g' src/ios/Minis.xcodeproj/project.pbxproj
          python3 "$SCRIPT_DIR/fix_fileprovider_deployment.py"
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig 2>/dev/null || true
          echo "=== 部署目标分布 ==="
          grep -n "IPHONEOS_DEPLOYMENT_TARGET" src/ios/Minis.xcodeproj/project.pbxproj | head

      - name: "编译原生依赖 (LAME/FFmpeg/iSH/Alpine/RClone)"
        run: |
          set -e
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          sed -i '' 's/-miphoneos-version-min=[0-9.]*/-miphoneos-version-min=${{ env.DEPLOY_TARGET }}/; s/-mios-simulator-version-min=[0-9.]*/-mios-simulator-version-min=${{ env.DEPLOY_TARGET }}/' deps/build_rclone_ios.sh
          ./deps/build_rclone_ios.sh

      # ★v56.4 新增: 产物级幂等门 ——
      #   v56.4 本地复跑时踩到一个**一直存在**的洞:
      #   fix_markdown_layout_reconcile 的锚点是
      #       OLD = "attrs.size.height = fittingSize.height"
      #   而它注入出去的段**末尾仍然含这一行**(这行就是最终赋值)。
      #   于是第二次跑 OLD 仍在 -> 又注入一份 -> `var _ios15TkSum`
      #   声明两次 ⇒ Swift invalid redeclaration ⇒ 编译失败。
      #   为什么 CI 从没炸: CI 每次都是干净上游重建 + 只跑一遍,
      #   永远碰不到第二遍。
      #   ⇒ 纪律: 幂等必须**在产物层面真跑**才算验证过;
      #     逐个函数静态看, 永远漏「锚点被自己包含」这一类。
      #   ★注意本步的 src/ios 是**已移植产物**(fallback 前面已跑过),
      #     所以第 1 轮等于「跑第 2 次」, 检测的是「判据能不能挡住再注入」。
      #     脚本另外会扫最终产物的注入变量有无重复声明, 两道一起覆盖。
      #     从干净上游跑第一遍的幂等, 由本地同一条命令验证:
      #       python3 scripts/ios15_verify/check_idempotent_reapply.py \
      #         scripts/ios15_fallback.py <干净上游>/src/ios 3
      #   ★v56.5 补: 基线换成 .upstream-ios(干净上游), 「从零跑第一遍」这一半
      #     也在覆盖范围内了。此前拿已移植产物当输入, 只能测「能不能挡住
      #     再注入」; 那正好是漏掉 fix_markdown_layout_reconcile 重复注入的
      #     那一半 —— 它在干净基线上第一次跑时根本不会重复。
      - name: "产物级幂等门 (干净上游起跑, 连跑 3 遍, 逐字节比对)"
        run: |
          if python3 "$SCRIPT_DIR/ios15_verify/check_idempotent_reapply.py" \
               "$SCRIPT_DIR/ios15_fallback.py" .upstream-ios 3 ; then
            echo "✅ 从干净上游连跑 3 轮, 产物完全一致"
          else
            echo "❌ fallback 不幂等 —— 第二次跑会往产物里再插一份同样的段"
            echo "   后果: var/let 重复声明 ⇒ Swift invalid redeclaration ⇒ 编译失败"
            echo "   (CI 每次干净重建只跑一遍, 所以这个洞历史上从未在 CI 暴露;"
            echo "    它是本地复跑验幂等时才撞出来的)"
            echo "   修法: 判据要认**插入物自身**的标记, 别认锚点 ——"
            echo "        注入段末尾若仍含自己的锚点, 「锚点仍在」恒为真 = 没判据"
            exit 1
          fi

      # ★v56.4 新增: 编译前的 Swift 语法门禁 ——
      #   run#138 教训: v56.3 只改了一行表达式, 前面 15 步断言全绿,
      #   结果第 16 步 xcodebuild 才炸:
      #       SelectableMarkdownView.swift:6703:52:
      #       error: expected member name following '.'
      #   根因: `\(type(of: cur).(String(describing:)))` ——
      #   `type(of:)` 返回**元类型**, Swift 在元类型后接 `.` 会当成
      #   「元类型的成员访问」, 于是 `.(` 不是构造器调用而是成员名。
      #   正确形式: `String(describing: type(of: cur))`。
      #   ⇒ 这类错没有任何编译过的代码可照抄, 只能机器拦。
      #   ⇒ 且它就在**字符串插值内部**, 所以检查脚本必须「只剥注释、
      #     保留字符串」—— 剥字符串等于把案发现场清空, 脚本成废品。
      - name: "Swift 插值语法门禁 (run#135/#138 那类, 编译前 3 秒拦下)"
        run: |
          if python3 "$SCRIPT_DIR/ios15_verify/check_swift_interp_syntax.py" . ; then
            echo "✅ 无「元类型后接构造器」/ C 风格转换"
          else
            echo "❌ 存在 run#138 那类 Swift 语法错 —— 编译 100% 会失败(exit 65),"
            echo "   现在拦下比等 xcodebuild 报错快两个数量级"
            echo "   形态1: 插值里 \(type(of: x).( ... )) / \(T.self.( ... ))"
            echo "           修法: String(describing: type(of: x))"
            echo "   形态2: Swift 侧 C 风格转换 (unsigned long long)x (run#135)"
            echo "           修法: UInt64(x)"
            exit 1
          fi

      - name: "编译 App (不签名)"
        run: |
          set -e
          echo "============ 编译 (Release / iOS) ============"
          # ★不用 `set -e` 语义去吞错误码: xcodebuild 失败时要**先打印报错行再退出**。
          #   run#142 踩过: 原来 `xcodebuild ... > build.log 2>&1` 之后紧跟
          #   `grep -n "error:" build.log ... || true`, 但整块在 `set -e` 下 ——
          #   xcodebuild 一退出非零, shell **当场中止**, 后面两行 grep/ echo
          #   **根本没执行**, 页面上只剩 `Process completed with exit code 65`
          #   而看不到任何报错行, 只能靠猜。
          # ⇒ 改成: 关掉 set -e, 显式收 exit code, 打印诊断, 再自己 exit。
          set +e
          xcodebuild -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath DerivedData build > build.log 2>&1
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "=== ❌ xcodebuild 失败 (exit $RC) —— build.log 共 $(wc -l < build.log) 行 ==="
            echo "=== Swift/C 编译错误 (error:, 最多 60 条) ==="
            grep -nE "\.swift:[0-9]+:[0-9]+: error:|\.m:[0-9]+:[0-9]+: error:|error: " build.log \
              | head -60 || true
            echo "=== 最后 40 行原始输出 ==="
            tail -40 build.log
            echo "=== 把 build.log 传上去, 免得再猜 ==="
            cp build.log /tmp/build-fail.log 2>/dev/null || true
            exit "$RC"
          fi
          echo "=== 编译错误行 (error:, 最多 80 条) ==="
          grep -n "error:" build.log | grep -v "0 errors" | head -80 || true
          echo "编译成功"

      - name: "上传失败时的 build.log"
        if: failure()
        run: |
          if [ -f build.log ]; then
            cp build.log failed-build.log
            echo "已留存 failed-build.log ($(wc -l < build.log) 行)"
          fi

      - name: "剥离 iOS 15 不可启动的扩展 (dyld 体检: 缺框架 or 部署目标过高)"
        if: success()
        run: |
          set -e
          # 判据与实现见 scripts/strip_ios15_incompatible_extensions.py 的文档串:
          #   (a) 链接 iOS 15.5 不存在的框架 (AgentWidgetExtension → _AppIntents_SwiftUI)
          #   (b) LC_BUILD_VERSION.minos > 15.5 (MinisFileProvider 被抬到 16.0, 含
          #       iOS 16+ 符号, 设备实证 8 分钟 12 次秒崩:
          #       Symbol not found: _$s10Foundation12CharacterSetV12charactersInACSSh_tcfC)
          # (b) 是通用判据, 不依赖符号名单, 上游将来引入新高版本扩展也自动兜住。
          APP="DerivedData/Build/Products/Release-iphoneos/Minis.app"
          if [ ! -d "$APP" ]; then
            APP=$(find DerivedData -name "Minis.app" -type d -exec du -sk {} + | sort -rn | head -1 | cut -f2)
          fi
          echo "=== 待处理 .app: $APP ==="
          python3 "$SCRIPT_DIR/strip_ios15_incompatible_extensions.py" "$APP"

      - name: "提交移植结果 (幂等, 且仅编译成功后才提交)"
        run: |
          # 关键: 本步骤必须在"编译 App"成功之后。
          # 之前它位于编译之前, 导致 1.14 移植编译失败时仍把约 300 个坏文件提交到 main,
          # 污染了 ios15-build.yml 所依赖的 src/ios (原本能正常出包的源码)。
          # 现在: 编译失败 -> 作业中止 -> 不提交 -> main 保持可用。
          # 只 add src/ios: 避免把编译产物 (DerivedData/deps) 一并提交。
          git config user.email "ios15-port@codebuddy.local"
          git config user.name "iOS15 Port Bot"
          git add -A src/ios
          if git diff --cached --quiet; then
            echo "无改动, 跳过提交"
          else
            git commit -m "Auto-port OpenMinis to iOS 15 (scripts @ $(git rev-parse --short HEAD))" || true
            git push || echo "WARN: push 失败(可能是分支保护), 不影响后续打包"
          fi

      - name: "打包 IPA (供 TrollStore 安装)"
        if: success()
        run: |
          set -e
          echo "=== 所有 Minis.app 候选及大小 ==="
          find DerivedData -name "Minis.app" -type d -exec du -sh {} + || true
          APP="DerivedData/Build/Products/Release-iphoneos/Minis.app"
          if [ ! -d "$APP" ]; then
            APP=$(find DerivedData -name "Minis.app" -type d -exec du -sk {} + | sort -rn | head -1 | cut -f2)
          fi
          echo "=== 选用: $APP ==="
          du -sh "$APP"
          if [ ! -f "$APP/Info.plist" ]; then echo "Info.plist 不存在, 打包中止"; exit 1; fi
          rm -rf Payload "Minis-iOS${{ env.DEPLOY_TARGET }}.ipa"
          mkdir -p Payload
          ditto "$APP" "Payload/Minis.app"

          # ============================================================
          # 写入 entitlements（关键）
          # ------------------------------------------------------------
          # 编译时是 CODE_SIGNING_ALLOWED=NO → 二进制不带任何权限；如果打包只是
          # 裸 zip，TrollStore 的安装预览里就看不到 App Group / Keychain 组，
          # group.com.openminis.app 容器也不会被创建，分享扩展、跨进程共享、
          # iSH 状态同步全部落空（"人家的包有、我的没有"就是这个原因）。
          # 这里按各 target 自己的 .entitlements 做 ad-hoc(fakesign) 签名，
          # TrollStore 安装时会读取并保留这些 entitlements。
          # ============================================================
          ENT_DIR="src/ios"
          dump_ent() {  # $1 = Mach-O
            if command -v ldid >/dev/null 2>&1; then
              ldid -e "$1" 2>/dev/null || true
            else
              codesign -d --entitlements :- "$1" 2>/dev/null || true
            fi
          }
          sign_macho() {  # $1 = Mach-O, $2 = entitlements 文件(可空)
            if [ -n "$2" ] && [ -f "$2" ]; then
              if command -v ldid >/dev/null 2>&1; then ldid -S"$2" "$1"
              else codesign --force --sign - --timestamp=none --entitlements "$2" "$1"; fi
            else
              if command -v ldid >/dev/null 2>&1; then ldid -S "$1"
              else codesign --force --sign - --timestamp=none "$1"; fi
            fi
          }

          MAIN_EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' Payload/Minis.app/Info.plist)
          echo "主可执行文件: $MAIN_EXE"
          echo "签名工具: $(command -v ldid || echo codesign)"

          # 1) 内层 Mach-O (dylib / framework / 原生依赖): 纯 ad-hoc
          find Payload -type f -perm -u+x ! -path "*.appex/*" | while read -r F; do
            case "$F" in "Payload/Minis.app/$MAIN_EXE") continue;; esac
            if file "$F" | grep -q "Mach-O"; then sign_macho "$F" ""; fi
          done

          # 2) 内嵌扩展 (.appex): 用 CFBundleIdentifier 末段匹配同名 .entitlements
          #    工程里的 bundle id 是 com.openminis.app.{ShareExtension|AgentWidget|FileProvider},
          #    与 entitlements 目录名一一对应。之前按"扩展目录名"匹配会完全对不上
          #    (构建产物叫 MinisShare / AgentWidgetExtension / MinisFileProvider),
          #    结果三个扩展都没拿到 App Group。排除主 App 的 Minis.entitlements。
          find Payload/Minis.app -maxdepth 3 -name "*.appex" -type d | while read -r APPEX; do
            EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APPEX/Info.plist" 2>/dev/null || basename "$APPEX" .appex)
            BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPEX/Info.plist" 2>/dev/null || basename "$APPEX" .appex)
            LAST=$(echo "$BID" | awk -F. '{print $NF}' | tr -d ' \r')
            ENT=""
            # a) 精确匹配: entitlements 文件名 == bundle id 末段
            for E in $(find "$ENT_DIR" -name "*.entitlements" ! -name "Minis.entitlements"); do
              S=$(basename "$E" .entitlements | tr 'A-Z' 'a-z')
              if [ "$S" = "$(echo "$LAST" | tr 'A-Z' 'a-z')" ]; then ENT="$E"; break; fi
            done
            # b) 兜底: 子串互含
            if [ -z "$ENT" ]; then
              for E in $(find "$ENT_DIR" -name "*.entitlements" ! -name "Minis.entitlements"); do
                S=$(basename "$E" .entitlements | tr 'A-Z' 'a-z')
                case "$(echo "$LAST" | tr 'A-Z' 'a-z')" in *"$S"*) ENT="$E"; break;; esac
              done
            fi
            echo "扩展 $(basename "$APPEX") (bundle=$BID) -> exe=$EXE ent=${ENT:-(无)}"
            sign_macho "$APPEX/$EXE" "$ENT"
          done

          # 2.5) [TrollStore 无沙盒全套] 在上游 entitlements 基础上合并注入。
          #      TrollStore 安装时原样保留这些键 (amfid 校验被 TrollStore 绕过)。
          #      效果: App 运行在沙盒外 → 可访问设备上所有数据容器 (所有容器都是
          #      mobile uid 的文件)、整个钥匙串组、以 root 权限执行内置 helper。
          # 开关: UNSANDBOX=1 才注入 (下轮若仍不兼容可直接置 0, 不用改代码)。
          # v19 教训: v18 加了 platform-application → App 启动即闪退打不开
          # (platform-application 让 SpringBoard 以平台应用身份启动它, 普通侧载
          #  App 不具备该身份的启动条件)。v19 只留解除沙盒真正需要的那一个键。
          echo "UNSANDBOX=${UNSANDBOX:-0}"
          MAIN_ENT="$ENT_DIR/Minis.entitlements"
          if [ "${UNSANDBOX:-0}" = "1" ] && [ -f "$MAIN_ENT" ]; then
            add_ent() { /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" "$MAIN_ENT" 2>/dev/null || echo "  (已存在: $1)"; }
            # 解除沙盒的核心键 (唯一必需):
            add_ent com.apple.private.security.no-sandbox bool true
            # 低风险辅助键:
            add_ent com.apple.private.skip-library-validation bool true
            echo "=== 主 App entitlements (合并无沙盒键后) ==="
            plutil -p "$MAIN_ENT" || cat "$MAIN_ENT"
          else
            echo "ℹ️ UNSANDBOX 未开启, 保持上游原始 entitlements (沙盒内运行)"
          fi

          # 3) 主 App (最后签, 带上 App Group / iCloud / HealthKit …)
          sign_macho "Payload/Minis.app/$MAIN_EXE" "$ENT_DIR/Minis.entitlements"

          # 4) 校验: 主 App 必须真的带上 App Group, 否则 TrollStore 不会创建容器
          ENTOUT=$(dump_ent "Payload/Minis.app/$MAIN_EXE")
          echo "--- 主 App entitlements ---"
          echo "$ENTOUT" | head -40
          if echo "$ENTOUT" | grep -q "group.com.openminis.app"; then
            echo "✅ 主 App 已带 App Group: group.com.openminis.app"
          else
            echo "❌ 主 App 未带上 App Group 权限 (TrollStore 将不会创建共享容器)"; exit 1
          fi
          if [ "${UNSANDBOX:-0}" = "1" ]; then
            if echo "$ENTOUT" | grep -q "no-sandbox"; then
              echo "✅ 无沙盒 entitlements 已嵌入 (沙盒外运行 / 全容器 / 全钥匙串)"
            else
              echo "❌ no-sandbox 未嵌入 —— 沙盒解除失败!"; exit 1
            fi
          else
            echo "ℹ️ UNSANDBOX=0, 本次为沙盒内运行包"
          fi
          for APPEX in $(find Payload/Minis.app -maxdepth 3 -name "*.appex" -type d); do
            EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APPEX/Info.plist" 2>/dev/null || basename "$APPEX" .appex)
            if dump_ent "$APPEX/$EXE" | grep -q "group.com.openminis.app"; then
              echo "✅ $(basename "$APPEX") 已带 App Group"
            else
              echo "⚠️  $(basename "$APPEX") 未带 App Group (该扩展可能无法与主 App 共享数据)"
            fi
          done

          zip -qry "Minis-iOS${{ env.DEPLOY_TARGET }}.ipa" Payload
          if ! unzip -l "Minis-iOS${{ env.DEPLOY_TARGET }}.ipa" | grep -q "Payload/Minis.app/Info.plist"; then
            echo "IPA 结构错误 (缺少 Payload/Minis.app/Info.plist)"; exit 1
          fi
          SIZE=$(stat -f%z "Minis-iOS${{ env.DEPLOY_TARGET }}.ipa")
          echo "IPA 大小: $SIZE 字节"
          if [ "$SIZE" -lt 10000000 ]; then echo "IPA 小于 10MB, 疑似空包, 中止上传"; exit 1; fi
          ls -lh "Minis-iOS${{ env.DEPLOY_TARGET }}.ipa"

      - name: "自检: IPA 不得含 iOS 15 不可启动的扩展 (dyld 体检)"
        if: success()
        run: |
          set -e
          IPA="Minis-iOS${{ env.DEPLOY_TARGET }}.ipa"
          BAD=0
          # ① AgentWidgetExtension: 链接 iOS 15.5 不存在的 _AppIntents_SwiftUI
          if unzip -l "$IPA" | grep -q "AgentWidgetExtension.appex"; then
            echo "❌ IPA 仍含 AgentWidgetExtension.appex (Library not loaded → dyld 启动崩溃)"
            BAD=1
          fi
          # ② MinisFileProvider: 被 fix_fileprovider_deployment.py 抬到 iOS 16.0,
          #    含 iOS 16+ 符号 (实测缺 CharacterSet.init(charactersIn:) 桥接桩),
          #    在 15.5 上被拉起即 SIGABRT (设备实证: 8 分钟 12 次秒崩)。
          if unzip -l "$IPA" | grep -q "MinisFileProvider.appex"; then
            echo "❌ IPA 仍含 MinisFileProvider.appex (Symbol not found → 每次被拉起就秒崩)"
            BAD=1
          fi
          if [ "$BAD" = "1" ]; then
            echo "--- IPA 内全部 appex ---"
            unzip -l "$IPA" | grep '\.appex/' | awk '{print $4}'
            exit 1
          fi
          echo "✅ IPA 已剔除全部 iOS 15 不可启动的扩展 (dyld 崩溃根因已移除)"
          echo "--- IPA 内剩余 appex (应为空或仅 15.5 可加载者) ---"
          unzip -l "$IPA" | grep '\.appex/' | awk '{print $4}' || echo "(无)"

      - name: "上传 IPA"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Minis-iOS${{ env.DEPLOY_TARGET }}-ipa
          path: Minis-iOS${{ env.DEPLOY_TARGET }}.ipa

      - name: "上传编译日志 (失败时排错用)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          if-no-files-found: ignore
