          # 而末行裁切是**高度**不足造成的, 只修宽度永远治不好。
          # 修法: 在帧同步(最后一写)里一并把高度撑到 ios15LastNeededH。
          if grep -q "V39-FIXHEIGHT" src/ios/Views/Chat/SelectableMarkdownView.swift \
             && grep -q "_needH39 > 1" src/ios/Views/Chat/SelectableMarkdownView.swift \
             && grep -q "fix.size.height = _needH39" src/ios/Views/Chat/SelectableMarkdownView.swift ; then

