          # v38 实测 (minis-2026-10-03 7.log) 的结论: v38-A 的**诊断对了, 修法错了**。
          # 量化: svH 恒定落在 needH 的 0.50~0.74, 37/37 无一例外, 且 svH 恒等于 frameH。
