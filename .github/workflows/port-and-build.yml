          # 五组文本无一例外都是双值分布(327/936/252/664/1155), 修好后高度全部等于 needH。
          # V40-HCHAIN 打 0 次的原因: 它读 sv.frame 时值已经是对的, 条件恒为 false。
          #   → 诊断挂在"结果已修好"的那一层, 永远打不出来。同型第三次踩坑。
