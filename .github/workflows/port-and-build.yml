            _v42_pos=$(python3 -c "t=open('src/ios/Views/Chat/SelectableMarkdownView.swift',encoding='utf-8').read(); s=t.index('ios15LastNeededH = _needH'); a=t.index(chr(10)+'            ios15LatchedNeedH = _needH', s); b=t.index(chr(10)+'            ios15LatchLen = textStorage.length', s); c=t.index(chr(10)+'            ios15LatchW = textContainer.size.width', s); d=t.index(chr(10)+'            ios15LatchHash = textStorage.mutableString.hash', s); g=t.index('NSLog('+chr(34)+'[V42-GATE]'); f=t.index('if !isScrollEnabled, let rCv2 = findCollectionView(), rCv2.bounds.width > 1 {'); print('OK' if s<a<b<c<d and g<f else 'BAD')")
            # 反向断言: 闩锁**禁止取 max**。max 在视图复用展示更短的新文本时会把新文本
