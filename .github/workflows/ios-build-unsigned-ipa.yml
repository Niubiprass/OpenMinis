name: iOS Build (unsigned IPA)

# 在 GitHub Actions 的 macOS runner 上编译 Minis，产出一个**未签名**的 IPA，
# 供 TrollStore（巨魔）直接侧载安装。
#
# 为什么走 CI 而不是本地 Xcode：本项目只能在 macOS + Xcode 上编译，而贡献者
# 可能只有手机和 GitHub 仓库。macOS runner 自带 Xcode 和完整的 CocoaPods/
# Homebrew 环境，是这种情况下唯一可行的编译路径。
#
# 产出的 IPA 未签名（CODE_SIGNING_ALLOWED=NO），TrollStore 接受这种 IPA：
# 它用自身的 vdtool 伪签名并安装，不需要开发者证书或描述文件。
#
# 用法：
#   Actions → iOS Build (unsigned IPA) → Run workflow
#   构建完成后从该次运行的 Artifacts 下载 minis-unsigned-ipa.zip
#
# 免费额度提示：macOS runner 的计费倍率是 Linux 的 10 倍，公开仓库免费额度
# 为每月 2000 分钟 ≈ 200 分钟 macOS 时间。完整构建（原生依赖从源码编译）
# 约需 60–100 分钟，因此建议只在需要时手动触发（本 workflow 默认即如此，
# 不在 push / PR 上自动运行）。

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        type: choice
        options:
          - Release
          - Debug
        default: Release
      run_tests:
        description: 'Run the standalone test suite (adds a few minutes)'
        type: boolean
        default: false

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    # macOS 14 已内置 Xcode 15；Xcode 16 需要 macOS 14.5+。
    # arm64 runner 比 Intel 快很多，原生依赖（FFmpeg / iSH / rclone）全量
    # 从源码编译，这一项直接决定总时长。
    runs-on: macos-14

    env:
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version

      - name: Verify Metal Toolchain
        # FFmpeg 的 configure 会探测 metal 编译器；缺失时**静默丢弃**
        # yadif_videotoolbox 滤镜，不报错但功能缺失。
        run: |
          if ! xcrun -sdk iphoneos metal --version; then
            echo "::warning::Metal Toolchain missing — yadif_videotoolbox will be dropped from FFmpeg"
          fi

      - name: Install build tools
        run: |
          brew install ninja llvm libarchive pkg-config
          pip3 install --user meson
          echo "$HOME/Library/Python/3.9/bin" >> "$GITHUB_PATH"

      - name: Set up Go (rclone)
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Cache native dependencies
        # 原生依赖从源码编译需要 60–100 分钟，是整个流程里唯一值得缓存的
        # 部分。key 里带上构建脚本的哈希：脚本一改，缓存自动失效。
        # 这一步必须排在各 build_*.sh 之前 —— actions/cache 在命中时会把
        # 上次产物直接还原到 deps/ 下，各脚本检测到已存在的产物就会跳过编译。
        uses: actions/cache@v4
        with:
          path: |
            deps/lame-build
            deps/frameworks
            deps/libs
            deps/include
            deps/resources
          key: ios15-native-deps-${{ hashFiles('deps/build_*.sh', 'deps/prepare_alpine_rootfs.sh') }}
          restore-keys: ios15-native-deps-

      - name: Build LAME
        run: ./deps/build_lame.sh

      - name: Build FFmpeg
        run: ./deps/build_ffmpeg.sh

      - name: Build iSH
        run: ./deps/build_ish.sh

      - name: Prepare Alpine rootfs
        run: ./deps/prepare_alpine_rootfs.sh

      - name: Build rclone XCFramework
        run: ./deps/build_rclone_ios.sh

      - name: Build the app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build/xcodebuild.log

      - name: Run standalone tests
        if: inputs.run_tests
        run: |
          swift src/ios/MinisTests/Standalone/VoiceToolbarLabelFitTests.swift || true

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find build/DerivedData/Build/Products -maxdepth 2 -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::No .app produced"
            exit 1
          fi
          echo "Packaging $APP"

          # 用一个临时的伪签名身份让 xcodebuild 产出可解压的 bundle 结构。
          # TrollStore 安装时会自行伪签名，这里只需要 bundle 结构完整。
          IPA_DIR="$RUNNER_TEMP/ipa"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP" "$IPA_DIR/Payload/"
          (cd "$IPA_DIR" && zip -qry "$GITHUB_WORKSPACE/minis-unsigned.ipa" Payload)

          mkdir -p "$GITHUB_WORKSPACE/artifact"
          cp "$GITHUB_WORKSPACE/minis-unsigned.ipa" "$GITHUB_WORKSPACE/artifact/"
          # 同时提供未压缩的 .app，方便用户用其他工具二次签名
          (cd "$IPA_DIR" && zip -qry "$GITHUB_WORKSPACE/artifact/Minis.app.zip" Payload/*.app)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: minis-unsigned-ipa
          path: artifact/
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/xcodebuild.log
          retention-days: 7
