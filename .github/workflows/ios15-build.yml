name: Build OpenMinis IPA (iOS 15)

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: "Minimum iOS version the app is built for (16.0 is the upstream minimum)"
        required: false
        default: "15.0"
      configuration:
        description: "Build configuration"
        required: false
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # The source uses iOS 26 SDK APIs behind #available guards, so a runner
    # with Xcode 26+ is required. Alternatives: macos-15, or macos-latest.
    runs-on: macos-26
    timeout-minutes: 300

    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Report Xcode and SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          uname -m

      - name: Install native build dependencies
        run: |
          brew install ninja llvm libarchive pkg-config lld
          python3 -m pip install --break-system-packages meson
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "--- meson check ---"; which meson && meson --version || echo "[warn] meson still not on PATH"

      - name: Prepare build-time customization file
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      - name: Restore cached native dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps/lame-build
            deps/lame-3.100
            deps/ffmpeg-6.1.2
            deps/frameworks
            deps/libs
            deps/include
            deps/resources
            deps/.cache
          key: deps-${{ runner.os }}-${{ hashFiles('deps/build_lame.sh','deps/build_ffmpeg.sh','deps/build_ish.sh','deps/prepare_alpine_rootfs.sh') }}

      - name: Build LAME
        run: ./deps/build_lame.sh

      - name: Build FFmpeg
        run: ./deps/build_ffmpeg.sh

      - name: Build iSH
        run: ./deps/build_ish.sh

      - name: Prepare Alpine rootfs
        run: ./deps/prepare_alpine_rootfs.sh

      - name: Apply iOS deployment target
        if: ${{ inputs.deployment_target != '16.0' }}
        run: |
          TARGET='${{ inputs.deployment_target }}'
          PBX=src/ios/Minis.xcodeproj/project.pbxproj
          sed -i '' -E "s/IPHONEOS_DEPLOYMENT_TARGET = (16|16\.2|26\.2);/IPHONEOS_DEPLOYMENT_TARGET = ${TARGET};/g" "$PBX"
          grep -c "IPHONEOS_DEPLOYMENT_TARGET = ${TARGET};" "$PBX"

      - name: Build Minis.app
        run: |
          set -o pipefail
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration '${{ inputs.configuration }}' \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Extract compiler errors
        if: always()
        run: |
          if [ -f build.log ]; then
            grep -E "error:" build.log | sed -E 's|^/Users/[^:]+/||' | sort -u > errors.txt || true
            echo "distinct errors: $(wc -l < errors.txt)"
          fi

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build.log
            errors.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Package unsigned IPA
        run: |
          APP="build/Build/Products/${{ inputs.configuration }}-iphoneos/Minis.app"
          test -d "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Minis.ipa Payload
          ls -lh Minis.ipa
          unzip -l Minis.ipa | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Minis-ipa
          path: Minis.ipa
          retention-days: 30
          if-no-files-found: error
