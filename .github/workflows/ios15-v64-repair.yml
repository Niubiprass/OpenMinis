name: iOS15 v64 Repair

on:
  workflow_dispatch:
  push:
    branches: [ios15-v64-repair]
    paths: ['src/ios/**', 'scripts/test_v64r_*.py', 'scripts/test_scroll_deferred_identity.py', 'scripts/test_longtext_container_layout.py', 'scripts/test_thinking_visibility.py', 'scripts/test_stream_text_fade_source.py', 'scripts/v64r_package.py', 'deps/build_rclone_ios.sh', '.github/workflows/ios15-v64-repair.yml']

permissions:
  contents: read

concurrency:
  group: ios15-v64-repair-${{ github.ref }}
  cancel-in-progress: false

env:
  IOS_DEPLOYMENT_TARGET: '15.5'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Verify fixed source (never fetch or re-port upstream)
        run: |
          git log -1 --format='%H %s'
          python3 scripts/test_v64r_text_layout.py
          python3 scripts/test_v64r_render_contracts.py
          python3 scripts/test_stream_text_fade_source.py
          V64R_REQUIRE_SWIFT=1 python3 scripts/test_v64r_autocompress.py
          V64R_REQUIRE_SWIFT=1 python3 scripts/test_v64r_attribute_prefix.py
          V64R_REQUIRE_SWIFT=1 python3 scripts/test_v64r_live_assistant.py
          # Three-agent source contracts; Swift helpers fail closed on macOS.
          python3 scripts/test_host_stable_shrink.py
          python3 scripts/test_scroll_deferred_identity.py
          python3 scripts/test_longtext_container_layout.py
          V64R_REQUIRE_SWIFT=1 python3 scripts/test_thinking_visibility.py
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true
          cache-dependency-path: deps/rclone-mobile/go.sum
      - name: Cache native dependencies (v64 scripts and deployment are part of key)
        id: native
        uses: actions/cache@v4
        with:
          path: |
            deps/frameworks
            deps/libs
            deps/include
            deps/alpine-rootfs.tar.gz
            deps/resources
          key: native-v64r-ios15.5-${{ runner.arch }}-${{ hashFiles('deps/build_*.sh', 'deps/rclone-mobile/**', 'deps/prepare_alpine_rootfs.sh', '.gitmodules') }}
      - name: Install build tools
        run: |
          brew install meson ninja pkg-config nasm llvm lld libarchive ccache
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          if ! test -f src/ios/Configs/ProviderCustomization.xcconfig; then
            cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig
          fi
          command -v meson
          command -v ninja
          command -v pkg-config
          command -v nasm
      - name: Build native libraries
        run: |
          set -euo pipefail
          bash deps/build_lame.sh
          bash deps/build_ffmpeg.sh
          bash deps/build_ish.sh
          bash deps/prepare_alpine_rootfs.sh
          bash deps/build_rclone_ios.sh
      - name: Build fixed v64 repair source
        run: |
          set -o pipefail
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData -clonedSourcePackagesDirPath SPMCache \
            -parallelizeTargets -jobs 4 CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            CURRENT_PROJECT_VERSION=160646 \
            SWIFT_OPTIMIZATION_LEVEL=-Osize build 2>&1 | tee build-v64r.log
      - name: Package without adding elevated entitlements
        run: |
          set -euo pipefail
          APP=DerivedData/Build/Products/Release-iphoneos/Minis.app
          test -f "$APP/Info.plist"
          mkdir -p Payload
          ditto "$APP" Payload/Minis.app
          python3 scripts/strip_ios15_incompatible_extensions.py Payload/Minis.app
          # Preserve only source entitlements; no sandbox-disabling additions.
          python3 scripts/v64r_package.py Payload/Minis.app
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' Payload/Minis.app/Info.plist
          xcrun vtool -show-build Payload/Minis.app/Minis | tee minos-v64r.txt
          zip -qry Minis-160646-Repair6-iOS15.5.ipa Payload
          unzip -tq Minis-160646-Repair6-iOS15.5.ipa
          shasum -a 256 Minis-160646-Repair6-iOS15.5.ipa > SHA256SUMS
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Minis-160646-Repair6-iOS15.5
          path: |
            Minis-160646-Repair6-iOS15.5.ipa
            SHA256SUMS
            minos-v64r.txt
          retention-days: 30
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Minis-v64r-build-evidence
          path: |
            build-v64r.log
            minos-v64r.txt
          if-no-files-found: ignore
          retention-days: 14
