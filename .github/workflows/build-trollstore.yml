name: Build OpenMinis TrollStore IPA

on:
  workflow_dispatch:      # 手动触发
  push:
    branches: [trollstore]  # 推到 trollstore 分支自动构建

jobs:
  build:
    runs-on: macos-15      # 自带 Xcode 16 + iOS SDK
    steps:
      - name: Checkout（含子模块 iSH / PRoot fork）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装构建依赖
        run: |
          brew install ninja llvm libarchive pkg-config ldid
          pip3 install --break-system-packages meson

      - name: 构建 TrollStore IPA
        run: ./scripts/build_trollstore_ipa.sh

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-TrollStore
          path: build-trollstore/OpenMinis-TrollStore.ipa
          if-no-files-found: error
